<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>資產清單與淨值</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.45);
      --input-bg: rgba(15, 23, 42, 0.6);
      --accent-color: #38bdf8;
      --leverage-color: #4ade80;
      --cash-color: #facc15;
      --text-color: #f8fafc;
      --sub-text: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
      --danger-color: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      padding: 20px;
      padding-bottom: 90px !important;
      display: flex; flex-direction: column; align-items: center;
    }

    .container {
      width: 100%; max-width: 400px;
      position: relative; z-index: 1;
    }

    /* 頂部總覽卡片 */
    .summary-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 24px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }

    .summary-label {
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.2em; color: var(--sub-text);
      text-transform: uppercase;
    }

    .summary-value {
      font-size: 2.8rem; font-weight: 700;
      color: var(--accent-color);
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      margin: 6px 0;
    }

    .summary-sub {
      font-size: 0.8rem; color: #94a3b8;
      display: flex; justify-content: center; gap: 12px;
    }

    /* 分組卡片 */
    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    /* 可折疊卡片標題 */
    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .section-title {
      font-size: 0.9rem; font-weight: 600;
      letter-spacing: 0.1em; color: #cbd5e1;
      display: flex; align-items: center; gap: 8px;
    }

    .section-action {
      display: flex; align-items: center; gap: 10px;
    }

    .section-total {
      font-size: 0.85rem; font-weight: 600;
      color: #94a3b8;
    }

    /* 展開/收合旋轉箭頭 */
    .arrow-icon {
      font-size: 0.75rem;
      color: var(--sub-text);
      transition: transform 0.3s ease;
      display: inline-block;
    }
    .arrow-icon.open {
      transform: rotate(180deg);
    }

    /* 可折疊明細容器：預設隱藏 */
    .section-body {
      display: none;
      margin-top: 14px;
      padding-top: 4px;
    }
    .section-body.open {
      display: block;
    }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .dot-orig { background: var(--accent-color); box-shadow: 0 0 8px var(--accent-color); }
    .dot-lev { background: var(--leverage-color); box-shadow: 0 0 8px var(--leverage-color); }
    .dot-cash { background: var(--cash-color); box-shadow: 0 0 8px var(--cash-color); }

    .add-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--accent-color);
      padding: 6px 12px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .add-btn:active { transform: scale(0.95); }

    /* 資產膠囊列表 */
    .asset-capsule {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 16px; border-radius: 16px;
      margin-bottom: 10px; transition: transform 0.15s, background 0.2s;
      cursor: pointer;
    }
    .asset-capsule:active {
      transform: scale(0.98);
      background: rgba(30, 41, 59, 0.8);
    }
    .asset-capsule:last-child { margin-bottom: 0; }

    .asset-info { display: flex; flex-direction: column; }
    .asset-symbol {
      font-size: 1rem; font-weight: 600; color: #f8fafc;
      display: flex; align-items: center; gap: 6px;
    }

    .badge-lev {
      font-size: 0.65rem; padding: 2px 6px; border-radius: 6px;
      background: rgba(74, 222, 128, 0.15); color: var(--leverage-color);
      border: 1px solid rgba(74, 222, 128, 0.3); font-weight: 700;
    }

    .asset-detail { font-size: 0.75rem; color: var(--sub-text); margin-top: 2px; }

    .asset-val {
      font-size: 1.05rem; font-weight: 600; color: #f8fafc;
      text-align: right;
    }

    /* 底部滑出抽屜 (Bottom Sheet) */
    .sheet-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
      z-index: 9998; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .sheet-overlay.active { opacity: 1; pointer-events: auto; }

    .bottom-sheet {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100vw;
      background: rgba(30, 41, 59, 0.98);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding: 24px;
      padding-bottom: 90px !important;
      z-index: 9999;
      transition: bottom 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-height: 85vh;
      overflow-y: auto;
    }
    .bottom-sheet.active { bottom: 0; }

    .sheet-handle {
      width: 36px; height: 4px; background: rgba(255, 255, 255, 0.2);
      border-radius: 2px; margin-bottom: 20px;
    }

    .sheet-title {
      font-size: 1.1rem; font-weight: 600; color: #f8fafc; margin-bottom: 20px;
    }

    .form-group { width: 100%; max-width: 360px; margin-bottom: 16px; }
    .form-label { font-size: 0.8rem; color: var(--sub-text); margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1px solid var(--border-color); background: var(--input-bg);
      color: #f8fafc; font-size: 1rem; outline: none;
    }

    .price-hint {
      font-size: 0.72rem; color: var(--accent-color); margin-top: 4px; display: none;
    }

    .type-selector, .lev-selector {
      display: flex; gap: 8px; width: 100%; max-width: 360px;
    }
    .type-btn, .lev-btn {
      flex: 1; padding: 10px; border-radius: 12px;
      border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.4);
      color: var(--sub-text); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .type-btn.active, .lev-btn.active {
      background: rgba(56, 189, 248, 0.2); border-color: var(--accent-color); color: #f8fafc;
    }

    .action-btn-group {
      width: 100%; max-width: 360px; display: flex; gap: 10px; margin-top: 10px;
    }

    .submit-btn {
      flex: 1; padding: 14px;
      border-radius: 14px; border: none; background: var(--accent-color);
      color: #0f172a; font-size: 1rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .delete-btn {
      padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(244, 63, 94, 0.3);
      background: rgba(244, 63, 94, 0.15); color: var(--danger-color);
      font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
      display: none;
    }
    .delete-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 頂部總淨值彙總 -->
    <div class="summary-card">
      <div class="summary-label">NET WORTH</div>
      <div class="summary-value" id="total-net-worth">$0</div>
      <div class="summary-sub">
        <span>原 <strong id="pct-orig">0%</strong></span>
        <span>槓 <strong id="pct-lev">0%</strong></span>
        <span>現 <strong id="pct-cash">0%</strong></span>
      </div>
    </div>

    <!-- 1. 原型資產 -->
    <div class="section-card">
      <div class="section-header" onclick="toggleSection('orig')">
        <span class="section-title">
          <div class="dot dot-orig"></div> 原型股票
          <span class="arrow-icon" id="arrow-orig">▼</span>
        </span>
        <div class="section-action">
          <span class="section-total" id="total-orig-val">$0</span>
          <button class="add-btn" onclick="openSheet('original', event)">+ 新增</button>
        </div>
      </div>
      <div class="section-body" id="body-orig">
        <div id="list-original"></div>
      </div>
    </div>

    <!-- 2. 槓桿資產 -->
    <div class="section-card">
      <div class="section-header" onclick="toggleSection('lev')">
        <span class="section-title">
          <div class="dot dot-lev"></div> 槓桿資產
          <span class="arrow-icon" id="arrow-lev">▼</span>
        </span>
        <div class="section-action">
          <span class="section-total" id="total-lev-val">$0</span>
          <button class="add-btn" onclick="openSheet('leverage', event)">+ 新增</button>
        </div>
      </div>
      <div class="section-body" id="body-lev">
        <div id="list-leverage"></div>
      </div>
    </div>

    <!-- 3. 現金與房屋 -->
    <div class="section-card">
      <div class="section-header" onclick="toggleSection('cash')">
        <span class="section-title">
          <div class="dot dot-cash"></div> 現金與房屋
          <span class="arrow-icon" id="arrow-cash">▼</span>
        </span>
        <div class="section-action">
          <span class="section-total" id="total-cash-val">$0</span>
          <button class="add-btn" onclick="openSheet('cash', event)">+ 新增</button>
        </div>
      </div>
      <div class="section-body" id="body-cash">
        <div id="list-cash"></div>
      </div>
    </div>

  </div>

  <!-- 底部滑出抽屜 -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title">新增資產</div>

    <div class="form-group">
      <label class="form-label">資產類別</label>
      <div class="type-selector">
        <div class="type-btn active" id="type-orig" onclick="setType('original')">原型</div>
        <div class="type-btn" id="type-lev" onclick="setType('leverage')">槓桿</div>
        <div class="type-btn" id="type-cash" onclick="setType('cash')">現金/房屋</div>
      </div>
    </div>

    <div class="form-group" id="group-symbol">
      <label class="form-label">標的代號 / 名稱 (支援台股如 0050、美股如 VT)</label>
      <input type="text" id="input-symbol" class="form-input" placeholder="例如：0050, 00631L, VT" onblur="fetchStockPrice()">
      <div class="price-hint" id="price-hint">正在連線抓取最新股價...</div>
    </div>

    <div class="form-group" id="group-lev-multiple" style="display: none;">
      <label class="form-label">槓桿倍數</label>
      <div class="lev-selector">
        <div class="lev-btn" id="lev-1.5" onclick="setLev(1.5)">1.5X</div>
        <div class="lev-btn active" id="lev-2" onclick="setLev(2)">2.0X</div>
        <div class="lev-btn" id="lev-3" onclick="setLev(3)">3.0X</div>
      </div>
    </div>

    <div class="form-group" id="group-shares">
      <label class="form-label">持有股數</label>
      <input type="number" id="input-shares" class="form-input" placeholder="例如：1000">
    </div>

    <div class="form-group" id="group-price">
      <label class="form-label">估算單價 / 現值 (元)</label>
      <input type="number" id="input-price" class="form-input" placeholder="代號輸入後自動抓取，亦可手動修正">
    </div>

    <div class="form-group" id="group-total-val" style="display: none;">
      <label class="form-label">總金額 (元)</label>
      <input type="number" id="input-total-val" class="form-input" placeholder="例如：500000">
    </div>

    <div class="action-btn-group">
      <button class="delete-btn" id="btn-delete" onclick="executeDeleteAsset()">刪除</button>
      <button class="submit-btn" id="btn-submit" onclick="saveAsset()">儲存資產</button>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbydO1G5uaoLlFgCC6lEBFEOeT0vwS5cycdMZ40Q20mxk9p-fNNws13cvBg3iqanpgqheQ/exec";

    let assets = JSON.parse(localStorage.getItem('user_assets')) || [
      { id: 1, type: 'original', symbol: '0050', shares: 20000, price: 190 },
      { id: 2, type: 'leverage', symbol: '00631L', shares: 15000, price: 210, multiple: 2 },
      { id: 3, type: 'cash', symbol: '銀行活存', val: 1200000 }
    ];

    let currentType = 'original';
    let currentLevMultiple = 2;
    let editingAssetId = null;

    function formatNumber(num) {
      if (!num || isNaN(num)) return '0';
      return Number(Math.round(num)).toLocaleString('en-US');
    }

    // 控制區塊展開與收合
    function toggleSection(sectionKey) {
      const body = document.getElementById(`body-${sectionKey}`);
      const arrow = document.getElementById(`arrow-${sectionKey}`);

      if (body.classList.contains('open')) {
        body.classList.remove('open');
        arrow.classList.remove('open');
      } else {
        body.classList.add('open');
        arrow.classList.add('open');
      }
    }

    async function fetchStockPrice() {
      const symbolInput = document.getElementById('input-symbol').value.trim();
      const hint = document.getElementById('price-hint');
      const priceInput = document.getElementById('input-price');

      if (!symbolInput || currentType === 'cash') return;
      if (!GAS_API_URL || GAS_API_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") return;

      hint.innerText = "⚡ 正在查詢即時股價...";
      hint.style.display = "block";

      try {
        const response = await fetch(`${GAS_API_URL}?symbol=${encodeURIComponent(symbolInput)}`);
        const data = await response.json();

        if (data.status === 'success' && data.price) {
          priceInput.value = parseFloat(data.price).toFixed(2);
          hint.innerText = `✓ 已更新最新現值：$${data.price}`;
        } else {
          hint.innerText = "✕ 未查得自動股價，請手動輸入";
        }
      } catch (err) {
        console.error(err);
        hint.innerText = "✕ 網路查詢失敗，請手動輸入股價";
      }
    }

    function renderAssets() {
      const listOrig = document.getElementById('list-original');
      const listLev = document.getElementById('list-leverage');
      const listCash = document.getElementById('list-cash');

      listOrig.innerHTML = ''; listLev.innerHTML = ''; listCash.innerHTML = '';

      let totalOrig = 0, totalLev = 0, totalCash = 0;

      assets.forEach(item => {
        let itemVal = 0;
        let html = '';

        if (item.type === 'cash') {
          itemVal = item.val || 0;
          totalCash += itemVal;
          html = `
            <div class="asset-capsule" onclick="openEditSheet(${item.id})">
              <div class="asset-info">
                <div class="asset-symbol">${item.symbol}</div>
              </div>
              <div class="asset-val">$${formatNumber(itemVal)}</div>
            </div>`;
          listCash.innerHTML += html;
        } else {
          itemVal = (item.shares || 0) * (item.price || 0);
          if (item.type === 'original') {
            totalOrig += itemVal;
            html = `
              <div class="asset-capsule" onclick="openEditSheet(${item.id})">
                <div class="asset-info">
                  <div class="asset-symbol">${item.symbol}</div>
                  <div class="asset-detail">${formatNumber(item.shares)} 股 · @$${item.price}</div>
                </div>
                <div class="asset-val">$${formatNumber(itemVal)}</div>
              </div>`;
            listOrig.innerHTML += html;
          } else {
            totalLev += itemVal;
            html = `
              <div class="asset-capsule" onclick="openEditSheet(${item.id})">
                <div class="asset-info">
                  <div class="asset-symbol">${item.symbol} <span class="badge-lev">${item.multiple || 2}X</span></div>
                  <div class="asset-detail">${formatNumber(item.shares)} 股 · @$${item.price}</div>
                </div>
                <div class="asset-val">$${formatNumber(itemVal)}</div>
              </div>`;
            listLev.innerHTML += html;
          }
        }
      });

      // 更新各卡片標題旁的分類資產總和
      document.getElementById('total-orig-val').innerText = '$' + formatNumber(totalOrig);
      document.getElementById('total-lev-val').innerText = '$' + formatNumber(totalLev);
      document.getElementById('total-cash-val').innerText = '$' + formatNumber(totalCash);

      // 更新頂部總金額與佔比
      const totalNetWorth = totalOrig + totalLev + totalCash;
      document.getElementById('total-net-worth').innerText = '$' + formatNumber(totalNetWorth);

      if (totalNetWorth > 0) {
        document.getElementById('pct-orig').innerText = Math.round((totalOrig / totalNetWorth) * 100) + '%';
        document.getElementById('pct-lev').innerText = Math.round((totalLev / totalNetWorth) * 100) + '%';
        document.getElementById('pct-cash').innerText = Math.round((totalCash / totalNetWorth) * 100) + '%';
      }

      localStorage.setItem('user_assets', JSON.stringify(assets));
      localStorage.setItem('alloc_original', totalOrig);
      localStorage.setItem('alloc_leverage', totalLev);
      localStorage.setItem('alloc_cash', totalCash);

      if (typeof updateGlowBackground === 'function') {
        updateGlowBackground();
      }
    }

    function openSheet(type, evt) {
      if (evt) evt.stopPropagation(); // 阻止點擊新增按鈕時觸發標題折疊/展開

      editingAssetId = null;
      document.getElementById('sheet-title').innerText = "新增資產";
      document.getElementById('btn-submit').innerText = "儲存資產";
      document.getElementById('btn-delete').style.display = "none";
      
      setType(type);
      document.getElementById('sheet-overlay').classList.add('active');
      document.getElementById('bottom-sheet').classList.add('active');
    }

    function openEditSheet(id) {
      const item = assets.find(a => a.id === id);
      if (!item) return;

      editingAssetId = id;
      document.getElementById('sheet-title').innerText = "編輯資產";
      document.getElementById('btn-submit').innerText = "更新資料";
      document.getElementById('btn-delete').style.display = "block";

      setType(item.type);
      document.getElementById('input-symbol').value = item.symbol || '';

      if (item.type === 'cash') {
        document.getElementById('input-total-val').value = item.val || '';
      } else {
        document.getElementById('input-shares').value = item.shares || '';
        document.getElementById('input-price').value = item.price || '';
        if (item.type === 'leverage') {
          setLev(item.multiple || 2);
        }
      }

      document.getElementById('sheet-overlay').classList.add('active');
      document.getElementById('bottom-sheet').classList.add('active');
    }

    function closeSheet() {
      document.getElementById('sheet-overlay').classList.remove('active');
      document.getElementById('bottom-sheet').classList.remove('active');
      document.getElementById('input-symbol').value = '';
      document.getElementById('input-shares').value = '';
      document.getElementById('input-price').value = '';
      document.getElementById('input-total-val').value = '';
      document.getElementById('price-hint').style.display = 'none';
      editingAssetId = null;
    }

    function setType(type) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
      
      const groupLev = document.getElementById('group-lev-multiple');
      const groupShares = document.getElementById('group-shares');
      const groupPrice = document.getElementById('group-price');
      const groupTotal = document.getElementById('group-total-val');

      if (type === 'original') {
        document.getElementById('type-orig').classList.add('active');
        groupLev.style.display = 'none';
        groupShares.style.display = 'block';
        groupPrice.style.display = 'block';
        groupTotal.style.display = 'none';
      } else if (type === 'leverage') {
        document.getElementById('type-lev').classList.add('active');
        groupLev.style.display = 'block';
        groupShares.style.display = 'block';
        groupPrice.style.display = 'block';
        groupTotal.style.display = 'none';
      } else {
        document.getElementById('type-cash').classList.add('active');
        groupLev.style.display = 'none';
        groupShares.style.display = 'none';
        groupPrice.style.display = 'none';
        groupTotal.style.display = 'block';
      }
    }

    function setLev(mult) {
      currentLevMultiple = mult;
      document.querySelectorAll('.lev-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`lev-${mult}`);
      if (activeBtn) {
        activeBtn.classList.add('active');
      } else if (event && event.target && event.target.classList) {
        event.target.classList.add('active');
      }
    }

    function saveAsset() {
      const symbol = document.getElementById('input-symbol').value.trim() || '未命名資產';

      let newData = {};
      if (currentType === 'cash') {
        const val = parseFloat(document.getElementById('input-total-val').value) || 0;
        newData = { type: 'cash', symbol: symbol, val: val };
      } else {
        const shares = parseFloat(document.getElementById('input-shares').value) || 0;
        const price = parseFloat(document.getElementById('input-price').value) || 0;
        newData = {
          type: currentType,
          symbol: symbol,
          shares: shares,
          price: price,
          multiple: currentType === 'leverage' ? currentLevMultiple : undefined
        };
      }

      if (editingAssetId !== null) {
        assets = assets.map(a => a.id === editingAssetId ? { ...a, ...newData } : a);
      } else {
        assets.push({ id: Date.now(), ...newData });
      }

      renderAssets();
      closeSheet();

      // 新增或更新後自動展開該類別，提升視覺反饋
      const keyMap = { original: 'orig', leverage: 'lev', cash: 'cash' };
      const targetKey = keyMap[currentType];
      if (targetKey) {
        const body = document.getElementById(`body-${targetKey}`);
        const arrow = document.getElementById(`arrow-${targetKey}`);
        if (body && !body.classList.contains('open')) {
          body.classList.add('open');
          if (arrow) arrow.classList.add('open');
        }
      }
    }

    function executeDeleteAsset() {
      if (editingAssetId !== null) {
        assets = assets.filter(a => a.id !== editingAssetId);
        renderAssets();
        closeSheet();
      }
    }

    window.onload = function() {
      renderAssets();
    };
  </script>

  <!-- 引入統一背景與導覽列腳本 -->
  <script src="glow.js"></script>
  <script src="nav.js"></script>

</body>
</html>
