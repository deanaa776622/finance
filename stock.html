<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>資產淨值試算</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --sub-text: #94a3b8;
      --border-color: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      padding-bottom: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    h2 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 15px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-color);
      font-size: 1rem;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: var(--accent-color);
    }
    .result-box {
      margin-top: 10px;
      text-align: center;
    }
    .result-title {
      font-size: 0.9rem;
      color: var(--sub-text);
    }
    .result-value {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 5px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>資產淨值試算</h2>

  <!-- 總淨值彙總卡片 -->
  <div class="card" style="border-color: var(--accent-color);">
    <div class="result-box">
      <div class="result-title">預估總淨值 (元)</div>
      <div class="result-value" id="total-net-worth">0</div>
    </div>
  </div>

  <!-- 1. 股票卡片 -->
  <div class="card">
    <div class="card-title">股票</div>
    <div class="input-group">
      <label>股票總價值 (元)</label>
      <input type="text" id="stock_val" value="0" oninput="formatAndCalculate(this)">
    </div>
  </div>

  <!-- 2. 現金卡片 -->
  <div class="card">
    <div class="card-title">現金</div>
    <div class="input-group">
      <label>現金總額 (元)</label>
      <input type="text" id="cash_val" value="0" oninput="formatAndCalculate(this)">
    </div>
  </div>

  <!-- 3. 房子卡片 -->
  <div class="card">
    <div class="card-title">房子</div>
    <div class="input-group">
      <label>房屋預估價值 (元)</label>
      <input type="text" id="house_val" value="0" oninput="formatAndCalculate(this)">
    </div>
  </div>
</div>

<script>
  function parseNumber(formattedStr) {
    if (!formattedStr) return 0;
    return parseFloat(formattedStr.toString().replace(/,/g, '')) || 0;
  }

  function formatAndCalculate(input) {
    let rawValue = parseNumber(input.value);
    if (rawValue > 999999999999999) rawValue = 999999999999999; 
    input.value = rawValue ? rawValue.toLocaleString('en-US') : (input.value === '0' ? '0' : '');
    calculateTotal();
  }

  function calculateTotal() {
    const stock = parseNumber(document.getElementById('stock_val').value);
    const cash = parseNumber(document.getElementById('cash_val').value);
    const house = parseNumber(document.getElementById('house_val').value);

    const total = stock + cash + house;
    document.getElementById('total-net-worth').innerText = total.toLocaleString('en-US');

    localStorage.setItem('nw_stock', stock);
    localStorage.setItem('sav_cash', cash);
    localStorage.setItem('nw_house', house);
  }

  window.onload = function() {
    if (localStorage.getItem('nw_stock')) {
      document.getElementById('stock_val').value = parseNumber(localStorage.getItem('nw_stock')).toLocaleString('en-US');
    }
    if (localStorage.getItem('sav_cash')) {
      document.getElementById('cash_val').value = parseNumber(localStorage.getItem('sav_cash')).toLocaleString('en-US');
    }
    if (localStorage.getItem('nw_house')) {
      document.getElementById('house_val').value = parseNumber(localStorage.getItem('nw_house')).toLocaleString('en-US');
    }
    calculateTotal();
  };
</script>
<!-- 引入統一管理的導覽列腳本 -->
<script src="nav.js"></script>
</body>
</html>
