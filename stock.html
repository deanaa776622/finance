<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>資產清單與淨值</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.45);
      --input-bg: rgba(15, 23, 42, 0.6);
      --accent-color: #38bdf8;
      --leverage-color: #4ade80;
      --cash-color: #facc15;
      --text-color: #f8fafc;
      --sub-text: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
      --danger-color: #f43f5e;

      /* Bottom Sheet 動態主題色變數 (預設原型天藍) */
      --active-theme-color: #38bdf8;
      --active-theme-rgb: 56, 189, 248;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      padding: 20px;
      padding-bottom: 90px !important;
      display: flex; flex-direction: column; align-items: center;
    }

    .container {
      width: 100%; max-width: 400px;
      position: relative; z-index: 1;
    }

    /* 頂部總覽卡片 */
    .summary-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 24px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      position: relative;
    }

    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .summary-label {
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.2em; color: var(--sub-text);
      text-transform: uppercase;
    }

    /* 批次刷新按鈕 */
    .refresh-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--accent-color);
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
      font-size: 0.9rem;
    }
    .refresh-btn:active { transform: scale(0.9); }
    .refresh-btn.spinning {
      animation: spin 1s linear infinite;
      pointer-events: none;
      opacity: 0.7;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .refresh-status {
      font-size: 0.72rem; color: var(--accent-color);
      margin-top: 4px; min-height: 18px; display: none;
    }

    .summary-value {
      font-size: 2.8rem; font-weight: 700;
      color: var(--accent-color);
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      margin: 4px 0;
    }

    .summary-sub {
      font-size: 0.8rem; color: #94a3b8;
      display: flex; justify-content: center; gap: 12px;
    }

    /* 分組卡片 */
    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; user-select: none;
    }

    .section-title {
      font-size: 0.9rem; font-weight: 600;
      letter-spacing: 0.1em; color: #cbd5e1;
      display: flex; align-items: center; gap: 8px;
    }

    .section-action {
      display: flex; align-items: center; gap: 10px;
    }

    .section-total {
      font-size: 0.85rem; font-weight: 600; color: #94a3b8;
    }

    .arrow-icon {
      font-size: 0.75rem; color: var(--sub-text);
      transition: transform 0.3s ease; display: inline-block;
    }
    .arrow-icon.open { transform: rotate(180deg); }

    .section-body {
      display: none; margin-top: 14px; padding-top: 4px;
    }
    .section-body.open { display: block; }

    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-orig { background: var(--accent-color); box-shadow: 0 0 8px var(--accent-color); }
    .dot-lev { background: var(--leverage-color); box-shadow: 0 0 8px var(--leverage-color); }
    .dot-cash { background: var(--cash-color); box-shadow: 0 0 8px var(--cash-color); }

    .add-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--accent-color);
      padding: 6px 12px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .add-btn:active { transform: scale(0.95); }

    /* 資產膠囊列表 */
    .asset-capsule {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 16px; border-radius: 16px;
      margin-bottom: 10px; transition: transform 0.15s, background 0.2s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .asset-capsule:active {
      transform: scale(0.98); background: rgba(30, 41, 59, 0.8);
    }
    .asset-capsule:last-child { margin-bottom: 0; }

    .asset-info { display: flex; flex-direction: column; z-index: 1; }
    .asset-symbol {
      font-size: 1rem; font-weight: 600; color: #f8fafc;
      display: flex; align-items: center; gap: 6px;
    }

    .badge-currency {
      font-size: 0.65rem; padding: 2px 5px; border-radius: 4px;
      background: rgba(56, 189, 248, 0.15); color: var(--accent-color);
      border: 1px solid rgba(56, 189, 248, 0.3); font-weight: 600;
    }

    .badge-lev {
      font-size: 0.65rem; padding: 2px 6px; border-radius: 6px;
      background: rgba(74, 222, 128, 0.15); color: var(--leverage-color);
      border: 1px solid rgba(74, 222, 128, 0.3); font-weight: 700;
    }

    .asset-detail { font-size: 0.75rem; color: var(--sub-text); margin-top: 2px; }

    .asset-val-box { text-align: right; z-index: 1; }
    .asset-val { font-size: 1.05rem; font-weight: 600; color: #f8fafc; }
    .asset-pct-text { font-size: 0.72rem; color: #94a3b8; margin-top: 2px; font-weight: 600; }

    /* 底部微型進度條 CSS */
    .capsule-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 0;
    }

    .capsule-progress-fill {
      height: 100%;
      border-radius: 0 2px 2px 0;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .capsule-progress-fill.orig {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.4), #38bdf8);
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
    }
    .capsule-progress-fill.lev {
      background: linear-gradient(90deg, rgba(74, 222, 128, 0.4), #4ade80);
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
    }
    .capsule-progress-fill.cash {
      background: linear-gradient(90deg, rgba(250, 204, 21, 0.4), #facc15);
      box-shadow: 0 0 6px rgba(250, 204, 21, 0.6);
    }

    /* 底部滑出抽屜 */
    .sheet-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
      z-index: 9998; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .sheet-overlay.active { opacity: 1; pointer-events: auto; }

    .bottom-sheet {
      position: fixed; bottom: -100%; left: 0; width: 100vw;
      background: rgba(30, 41, 59, 0.98); backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top-left-radius: 28px; border-top-right-radius: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding: 24px; padding-bottom: 90px !important;
      z-index: 9999; transition: bottom 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex; flex-direction: column; align-items: center;
      max-height: 85vh; overflow-y: auto;
    }
    .bottom-sheet.active { bottom: 0; }

    .sheet-handle {
      width: 36px; height: 4px; background: rgba(255, 255, 255, 0.2);
      border-radius: 2px; margin-bottom: 20px;
    }

    .sheet-title {
      font-size: 1.1rem; font-weight: 600; color: #f8fafc; margin-bottom: 20px;
    }

    .form-group { width: 100%; max-width: 360px; margin-bottom: 16px; }
    .form-label { font-size: 0.8rem; color: var(--sub-text); margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1px solid var(--border-color); background: var(--input-bg);
      color: #f8fafc; font-size: 1rem; outline: none;
      transition: opacity 0.2s, background 0.2s, border-color 0.3s;
    }
    .form-input:focus {
      border-color: var(--active-theme-color);
    }

    /* 停用 (Disabled) 狀態之 CSS 呈現 */
    .form-group.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .form-input:disabled {
      background: rgba(15, 23, 42, 0.3);
      color: var(--sub-text);
      cursor: not-allowed;
    }
    .type-btn.disabled, .lev-btn.disabled, .curr-btn.disabled, .mode-btn.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    .price-hint {
      font-size: 0.72rem; color: var(--active-theme-color); margin-top: 4px; display: none;
      transition: color 0.3s;
    }

    .type-selector, .lev-selector, .currency-selector, .mode-selector {
      display: flex; gap: 8px; width: 100%; max-width: 360px;
    }
    .type-btn, .lev-btn, .curr-btn, .mode-btn {
      flex: 1; padding: 10px; border-radius: 12px;
      border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.4);
      color: var(--sub-text); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; text-align: center; transition: all 0.3s ease;
    }

    /* 1. 資產類別專屬選屬狀態 (藍、綠、黃) */
    .type-btn#type-orig.active {
      background: rgba(56, 189, 248, 0.2); border-color: var(--accent-color); color: var(--accent-color);
    }
    .type-btn#type-lev.active {
      background: rgba(74, 222, 128, 0.2); border-color: var(--leverage-color); color: var(--leverage-color);
    }
    .type-btn#type-cash.active {
      background: rgba(250, 204, 21, 0.2); border-color: var(--cash-color); color: var(--cash-color);
    }

    /* 2. 動態連動主調色 (其他按鈕如：輸入模式、幣別、槓桿倍數) */
    .lev-btn.active, .curr-btn.active, .mode-btn.active {
      background: rgba(var(--active-theme-rgb), 0.2);
      border-color: var(--active-theme-color);
      color: var(--active-theme-color);
    }

    .action-btn-group {
      width: 100%; max-width: 360px; display: flex; gap: 10px; margin-top: 10px;
    }

    /* 3. 動態主題色儲存按鈕 */
    .submit-btn {
      flex: 1; padding: 14px; border-radius: 14px; border: none;
      background: var(--active-theme-color); color: #0f172a;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 0 15px rgba(var(--active-theme-rgb), 0.4);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .delete-btn {
      padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(244, 63, 94, 0.3);
      background: rgba(244, 63, 94, 0.15); color: var(--danger-color);
      font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
      display: none;
    }
    .delete-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 頂部總覽卡片 -->
    <div class="summary-card">
      <div class="summary-header">
        <div class="summary-label">NET WORTH (TWD)</div>
        <button class="refresh-btn" id="btn-refresh-all" onclick="refreshAllPrices()" title="一鍵更新股價與匯率">↻</button>
      </div>
      <div class="summary-value" id="total-net-worth">$0</div>
      <div class="refresh-status" id="refresh-status">⚡ 正在更新最新即時股價...</div>
      <div class="summary-sub">
        <span>原 <strong id="pct-orig">0%</strong></span>
        <span>槓 <strong id="pct-lev">0%</strong></span>
        <span>現 <strong id="pct-cash">0%</strong></span>
      </div>
    </div>

    <!-- 1. 原型資產 -->
    <div class="section-card">
      <div class="section-header" onclick="toggleSection('orig')">
        <span class="section-title">
          <div class="dot dot-orig"></div> 原型股票
          <span class="arrow-icon" id="arrow-orig">▼</span>
        </span>
        <div class="section-action">
          <span class="section-total" id="total-orig-val">NT$0</span>
          <button class="add-btn" onclick="openSheet('original', event)">+ 新增</button>
        </div>
      </div>
      <div class="section-body" id="body-orig">
        <div id="list-original"></div>
      </div>
    </div>

    <!-- 2. 槓桿資產 -->
    <div class="section-card">
      <div class="section-header" onclick="toggleSection('lev')">
        <span class="section-title">
          <div class="dot dot-lev"></div> 槓桿資產
          <span class="arrow-icon" id="arrow-lev">▼</span>
        </span>
        <div class="section-action">
          <span class="section-total" id="total-lev-val">NT$0</span>
          <button class="add-btn" onclick="openSheet('leverage', event)">+ 新增</button>
        </div>
      </div>
      <div class="section-body" id="body-lev">
        <div id="list-leverage"></div>
      </div>
    </div>

    <!-- 3. 現金與房屋 -->
    <div class="section-card">
      <div class="section-header" onclick="toggleSection('cash')">
        <span class="section-title">
          <div class="dot dot-cash"></div> 現金與房屋
          <span class="arrow-icon" id="arrow-cash">▼</span>
        </span>
        <div class="section-action">
          <span class="section-total" id="total-cash-val">NT$0</span>
          <button class="add-btn" onclick="openSheet('cash', event)">+ 新增</button>
        </div>
      </div>
      <div class="section-body" id="body-cash">
        <div id="list-cash"></div>
      </div>
    </div>

  </div>

  <!-- 底部滑出抽屜 (全控制項固定保持，防高度跳動) -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title">新增資產</div>

    <!-- 1. 資產類別 -->
    <div class="form-group">
      <label class="form-label">資產類別</label>
      <div class="type-selector">
        <div class="type-btn active" id="type-orig" onclick="setType('original')">原型</div>
        <div class="type-btn" id="type-lev" onclick="setType('leverage')">槓桿</div>
        <div class="type-btn" id="type-cash" onclick="setType('cash')">現金/房屋</div>
      </div>
    </div>

    <!-- 2. 輸入方式 (現金/房屋可切換；原型與槓桿預設為「股數單價」並鎖定) -->
    <div class="form-group" id="group-cash-mode">
      <label class="form-label">輸入方式</label>
      <div class="mode-selector">
        <div class="mode-btn" id="mode-total" onclick="setCashMode('total')">總金額 (存款/房產)</div>
        <div class="mode-btn active" id="mode-shares" onclick="setCashMode('shares')">股數與單價 (股票/ETF)</div>
      </div>
    </div>

    <!-- 3. 標的代號 / 名稱 -->
    <div class="form-group" id="group-symbol">
      <label class="form-label" id="label-symbol">標的代號 / 名稱 (支援台股如 0050、美股如 VT)</label>
      <input type="text" id="input-symbol" class="form-input" placeholder="例如：0050, 00631L, VT" onblur="fetchStockPrice()">
      <div class="price-hint" id="price-hint">正在連線抓取最新股價...</div>
    </div>

    <!-- 4. 計價幣別與匯率 -->
    <div class="form-group">
      <label class="form-label">計價幣別</label>
      <div class="currency-selector">
        <div class="curr-btn active" id="curr-TWD" onclick="setCurrency('TWD')">TWD (新台幣)</div>
        <div class="curr-btn" id="curr-USD" onclick="setCurrency('USD')">USD (美金)</div>
      </div>
    </div>

    <div class="form-group" id="group-rate">
      <label class="form-label">換算匯率 (USD ➔ TWD)</label>
      <input type="number" id="input-rate" class="form-input" placeholder="例如：32.2" value="32.0">
    </div>

    <!-- 5. 槓桿倍數 (僅槓桿資產啟用) -->
    <div class="form-group" id="group-lev-multiple">
      <label class="form-label">槓桿倍數</label>
      <div class="lev-selector">
        <div class="lev-btn" id="lev-1.5" onclick="setLev(1.5)">1.5X</div>
        <div class="lev-btn active" id="lev-2" onclick="setLev(2)">2.0X</div>
        <div class="lev-btn" id="lev-3" onclick="setLev(3)">3.0X</div>
      </div>
    </div>

    <!-- 6. 股數與單價 -->
    <div class="form-group" id="group-shares">
      <label class="form-label">持有股數</label>
      <input type="number" id="input-shares" class="form-input" placeholder="例如：1000">
    </div>

    <div class="form-group" id="group-price">
      <label class="form-label">估算單價 / 現值</label>
      <input type="number" id="input-price" class="form-input" placeholder="代號輸入後自動抓取，亦可手動修正">
    </div>

    <!-- 7. 總金額 (僅「現金/房屋 - 總金額模式」啟用) -->
    <div class="form-group" id="group-total-val">
      <label class="form-label">總金額</label>
      <input type="number" id="input-total-val" class="form-input" placeholder="例如：500000">
    </div>

    <!-- 按鈕組 -->
    <div class="action-btn-group">
      <button class="delete-btn" id="btn-delete" onclick="executeDeleteAsset()">刪除</button>
      <button class="submit-btn" id="btn-submit" onclick="saveAsset()">儲存資產</button>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbydO1G5uaoLlFgCC6lEBFEOeT0vwS5cycdMZ40Q20mxk9p-fNNws13cvBg3iqanpgqheQ/exec";

    let assets = JSON.parse(localStorage.getItem('user_assets')) || [
      { id: 1, type: 'original', symbol: '0050', shares: 20000, price: 190, currency: 'TWD', rate: 1 },
      { id: 2, type: 'leverage', symbol: '00631L', shares: 15000, price: 210, multiple: 2, currency: 'TWD', rate: 1 },
      { id: 3, type: 'cash', symbol: '銀行活存', val: 1200000, currency: 'TWD', rate: 1, isSharesMode: false }
    ];

    let currentType = 'original';
    let currentCurrency = 'TWD';
    let currentLevMultiple = 2;
    let currentCashMode = 'shares';
    let editingAssetId = null;

    function formatNumber(num) {
      if (!num || isNaN(num)) return '0';
      return Number(Math.round(num)).toLocaleString('en-US');
    }

    function toggleSection(sectionKey) {
      const body = document.getElementById(`body-${sectionKey}`);
      const arrow = document.getElementById(`arrow-${sectionKey}`);
      if (body.classList.contains('open')) {
        body.classList.remove('open'); arrow.classList.remove('open');
      } else {
        body.classList.add('open'); arrow.classList.add('open');
      }
    }

    async function refreshAllPrices() {
      const btn = document.getElementById('btn-refresh-all');
      const statusText = document.getElementById('refresh-status');

      if (!GAS_API_URL || GAS_API_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") return;

      btn.classList.add('spinning');
      statusText.style.display = 'block';
      statusText.innerText = '⚡ 正在更新最新即時股價...';

      let updateCount = 0;

      for (let i = 0; i < assets.length; i++) {
        const item = assets[i];
        if (item.type !== 'cash' || item.isSharesMode) {
          if (item.symbol) {
            try {
              const res = await fetch(`${GAS_API_URL}?symbol=${encodeURIComponent(item.symbol)}`);
              const data = await res.json();
              if (data.status === 'success' && data.price) {
                assets[i].price = parseFloat(data.price);
                if (data.currency) assets[i].currency = data.currency;
                if (data.usdtwd && data.currency === 'USD') assets[i].rate = parseFloat(data.usdtwd);
                updateCount++;
              }
            } catch (e) {
              console.error(`更新 ${item.symbol} 失敗:`, e);
            }
          }
        }
      }

      renderAssets();
      btn.classList.remove('spinning');
      statusText.innerText = `✓ 已更新 ${updateCount} 筆股票與最新匯率`;

      setTimeout(() => {
        statusText.style.display = 'none';
      }, 3000);
    }

    async function fetchStockPrice() {
      const symbolInput = document.getElementById('input-symbol').value.trim();
      const hint = document.getElementById('price-hint');
      const priceInput = document.getElementById('input-price');
      const rateInput = document.getElementById('input-rate');

      if (!symbolInput || (currentType === 'cash' && currentCashMode === 'total')) return;
      if (!GAS_API_URL || GAS_API_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") return;

      hint.innerText = "⚡ 正在查詢即時股價與匯率...";
      hint.style.display = "block";

      try {
        const response = await fetch(`${GAS_API_URL}?symbol=${encodeURIComponent(symbolInput)}`);
        const data = await response.json();

        if (data.status === 'success' && data.price) {
          priceInput.value = parseFloat(data.price).toFixed(2);
          if (data.currency) setCurrency(data.currency);
          if (data.usdtwd) rateInput.value = parseFloat(data.usdtwd).toFixed(2);
          hint.innerText = `✓ 已更新最新股價 (${data.currency})：$${data.price}`;
        } else {
          hint.innerText = "✕ 未查得自動股價，請手動輸入";
        }
      } catch (err) {
        console.error(err);
        hint.innerText = "✕ 網路查詢失敗，請手動輸入股價";
      }
    }

    function renderAssets() {
      const listOrig = document.getElementById('list-original');
      const listLev = document.getElementById('list-leverage');
      const listCash = document.getElementById('list-cash');

      listOrig.innerHTML = ''; listLev.innerHTML = ''; listCash.innerHTML = '';

      let totalOrigTWD = 0, totalLevTWD = 0, totalCashTWD = 0;

      // 第一階段：計算各類別總額
      assets.forEach(item => {
        const curr = item.currency || 'TWD';
        const fxRate = curr === 'USD' ? (item.rate || 32.0) : 1;
        let rawVal = item.type === 'cash' && !item.isSharesMode 
          ? (item.val || 0) 
          : ((item.shares || 0) * (item.price || 0));
        let twdVal = rawVal * fxRate;

        if (item.type === 'original') totalOrigTWD += twdVal;
        else if (item.type === 'leverage') totalLevTWD += twdVal;
        else if (item.type === 'cash') totalCashTWD += twdVal;
      });

      // 第二階段：計算佔比與渲染膠囊 (微型進度條)
      assets.forEach(item => {
        const curr = item.currency || 'TWD';
        const fxRate = curr === 'USD' ? (item.rate || 32.0) : 1;
        let rawVal = item.type === 'cash' && !item.isSharesMode 
          ? (item.val || 0) 
          : ((item.shares || 0) * (item.price || 0));
        let twdVal = rawVal * fxRate;

        let categoryTotal = 0;
        let fillClass = 'orig';

        if (item.type === 'original') {
          categoryTotal = totalOrigTWD;
          fillClass = 'orig';
        } else if (item.type === 'leverage') {
          categoryTotal = totalLevTWD;
          fillClass = 'lev';
        } else {
          categoryTotal = totalCashTWD;
          fillClass = 'cash';
        }

        const pct = categoryTotal > 0 ? (twdVal / categoryTotal) * 100 : 0;
        const pctFormatted = pct.toFixed(1) + '%';

        const progressBarHtml = `
          <div class="capsule-progress-track">
            <div class="capsule-progress-fill ${fillClass}" style="width: ${pct.toFixed(1)}%;"></div>
          </div>`;

        let html = '';

        if (item.type === 'cash') {
          if (item.isSharesMode) {
            html = `
              <div class="asset-capsule" onclick="openEditSheet(${item.id})">
                <div class="asset-info">
                  <div class="asset-symbol">${item.symbol} <span class="badge-currency">${curr}</span></div>
                  <div class="asset-detail">${formatNumber(item.shares)} 股 · @$${item.price}</div>
                </div>
                <div class="asset-val-box">
                  <div class="asset-val">NT$ ${formatNumber(twdVal)}</div>
                  <div class="asset-pct-text">${pctFormatted}</div>
                </div>
                ${progressBarHtml}
              </div>`;
          } else {
            html = `
              <div class="asset-capsule" onclick="openEditSheet(${item.id})">
                <div class="asset-info">
                  <div class="asset-symbol">${item.symbol} <span class="badge-currency">${curr}</span></div>
                </div>
                <div class="asset-val-box">
                  <div class="asset-val">NT$ ${formatNumber(twdVal)}</div>
                  <div class="asset-pct-text">${pctFormatted}</div>
                </div>
                ${progressBarHtml}
              </div>`;
          }
          listCash.innerHTML += html;
        } else if (item.type === 'original') {
          html = `
            <div class="asset-capsule" onclick="openEditSheet(${item.id})">
              <div class="asset-info">
                <div class="asset-symbol">${item.symbol} <span class="badge-currency">${curr}</span></div>
                <div class="asset-detail">${formatNumber(item.shares)} 股 · @$${item.price}</div>
              </div>
              <div class="asset-val-box">
                <div class="asset-val">NT$ ${formatNumber(twdVal)}</div>
                <div class="asset-pct-text">${pctFormatted}</div>
              </div>
              ${progressBarHtml}
            </div>`;
          listOrig.innerHTML += html;
        } else {
          html = `
            <div class="asset-capsule" onclick="openEditSheet(${item.id})">
              <div class="asset-info">
                <div class="asset-symbol">${item.symbol} <span class="badge-currency">${curr}</span> <span class="badge-lev">${item.multiple || 2}X</span></div>
                <div class="asset-detail">${formatNumber(item.shares)} 股 · @$${item.price}</div>
              </div>
              <div class="asset-val-box">
                <div class="asset-val">NT$ ${formatNumber(twdVal)}</div>
                <div class="asset-pct-text">${pctFormatted}</div>
              </div>
              ${progressBarHtml}
            </div>`;
          listLev.innerHTML += html;
        }
      });

      document.getElementById('total-orig-val').innerText = 'NT$ ' + formatNumber(totalOrigTWD);
      document.getElementById('total-lev-val').innerText = 'NT$ ' + formatNumber(totalLevTWD);
      document.getElementById('total-cash-val').innerText = 'NT$ ' + formatNumber(totalCashTWD);

      const totalNetWorthTWD = totalOrigTWD + totalLevTWD + totalCashTWD;
      document.getElementById('total-net-worth').innerText = '$' + formatNumber(totalNetWorthTWD);

      if (totalNetWorthTWD > 0) {
        document.getElementById('pct-orig').innerText = Math.round((totalOrigTWD / totalNetWorthTWD) * 100) + '%';
        document.getElementById('pct-lev').innerText = Math.round((totalLevTWD / totalNetWorthTWD) * 100) + '%';
        document.getElementById('pct-cash').innerText = Math.round((totalCashTWD / totalNetWorthTWD) * 100) + '%';
      }

      localStorage.setItem('user_assets', JSON.stringify(assets));
      localStorage.setItem('alloc_original', totalOrigTWD);
      localStorage.setItem('alloc_leverage', totalLevTWD);
      localStorage.setItem('alloc_cash', totalCashTWD);

      if (typeof updateGlowBackground === 'function') {
        updateGlowBackground();
      }
    }

    function openSheet(type, evt) {
      if (evt) evt.stopPropagation();
      editingAssetId = null;
      document.getElementById('sheet-title').innerText = "新增資產";
      document.getElementById('btn-submit').innerText = "儲存資產";
      document.getElementById('btn-delete').style.display = "none";
      
      setType(type);
      setCurrency('TWD');
      if (type === 'cash') setCashMode('total');
      else setCashMode('shares');

      document.getElementById('sheet-overlay').classList.add('active');
      document.getElementById('bottom-sheet').classList.add('active');
    }

    function openEditSheet(id) {
      const item = assets.find(a => a.id === id);
      if (!item) return;

      editingAssetId = id;
      document.getElementById('sheet-title').innerText = "編輯資產";
      document.getElementById('btn-submit').innerText = "更新資料";
      document.getElementById('btn-delete').style.display = "block";

      setType(item.type);
      setCurrency(item.currency || 'TWD');
      if (item.rate) document.getElementById('input-rate').value = item.rate;

      document.getElementById('input-symbol').value = item.symbol || '';

      if (item.type === 'cash') {
        if (item.isSharesMode) {
          setCashMode('shares');
          document.getElementById('input-shares').value = item.shares || '';
          document.getElementById('input-price').value = item.price || '';
        } else {
          setCashMode('total');
          document.getElementById('input-total-val').value = item.val || '';
        }
      } else {
        setCashMode('shares');
        document.getElementById('input-shares').value = item.shares || '';
        document.getElementById('input-price').value = item.price || '';
        if (item.type === 'leverage') {
          setLev(item.multiple || 2);
        }
      }

      document.getElementById('sheet-overlay').classList.add('active');
      document.getElementById('bottom-sheet').classList.add('active');
    }

    function closeSheet() {
      document.getElementById('sheet-overlay').classList.remove('active');
      document.getElementById('bottom-sheet').classList.remove('active');
      document.getElementById('input-symbol').value = '';
      document.getElementById('input-shares').value = '';
      document.getElementById('input-price').value = '';
      document.getElementById('input-total-val').value = '';
      document.getElementById('price-hint').style.display = 'none';
      editingAssetId = null;
    }

    // 重構：類別切換與動態主題配色控制
    function setType(type) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`type-${type === 'original' ? 'orig' : type === 'leverage' ? 'lev' : 'cash'}`).classList.add('active');

      const root = document.documentElement;

      // 切換 Bottom Sheet 動態 CSS 變數
      if (type === 'original') {
        root.style.setProperty('--active-theme-color', '#38bdf8');
        root.style.setProperty('--active-theme-rgb', '56, 189, 248');
      } else if (type === 'leverage') {
        root.style.setProperty('--active-theme-color', '#4ade80');
        root.style.setProperty('--active-theme-rgb', '74, 222, 128');
      } else {
        root.style.setProperty('--active-theme-color', '#facc15');
        root.style.setProperty('--active-theme-rgb', '250, 204, 21');
      }

      const modeGroup = document.getElementById('group-cash-mode');
      const levGroup = document.getElementById('group-lev-multiple');
      const btnModeTotal = document.getElementById('mode-total');
      const btnModeShares = document.getElementById('mode-shares');

      if (type === 'original' || type === 'leverage') {
        setCashMode('shares');
        modeGroup.classList.add('disabled');
        btnModeTotal.classList.add('disabled');
        btnModeShares.classList.remove('disabled');

        if (type === 'leverage') {
          levGroup.classList.remove('disabled');
        } else {
          levGroup.classList.add('disabled');
        }
      } else {
        modeGroup.classList.remove('disabled');
        btnModeTotal.classList.remove('disabled');
        btnModeShares.classList.remove('disabled');
        levGroup.classList.add('disabled');
        setCashMode(currentCashMode);
      }
    }

    function setCashMode(mode) {
      currentCashMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`mode-${mode}`).classList.add('active');

      const groupShares = document.getElementById('group-shares');
      const groupPrice = document.getElementById('group-price');
      const groupTotal = document.getElementById('group-total-val');
      const inputShares = document.getElementById('input-shares');
      const inputPrice = document.getElementById('input-price');
      const inputTotal = document.getElementById('input-total-val');

      if (mode === 'total' && currentType === 'cash') {
        groupShares.classList.add('disabled');
        groupPrice.classList.add('disabled');
        inputShares.disabled = true;
        inputPrice.disabled = true;

        groupTotal.classList.remove('disabled');
        inputTotal.disabled = false;
      } else {
        groupShares.classList.remove('disabled');
        groupPrice.classList.remove('disabled');
        inputShares.disabled = false;
        inputPrice.disabled = false;

        groupTotal.classList.add('disabled');
        inputTotal.disabled = true;
      }
    }

    function setCurrency(curr) {
      currentCurrency = curr;
      document.querySelectorAll('.curr-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`curr-${curr}`).classList.add('active');
      
      const groupRate = document.getElementById('group-rate');
      const inputRate = document.getElementById('input-rate');

      if (curr === 'USD') {
        groupRate.classList.remove('disabled');
        inputRate.disabled = false;
      } else {
        groupRate.classList.add('disabled');
        inputRate.disabled = true;
      }
    }

    function setLev(mult) {
      currentLevMultiple = mult;
      document.querySelectorAll('.lev-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`lev-${mult}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function saveAsset() {
      const symbol = document.getElementById('input-symbol').value.trim() || '未命名資產';
      const rate = currentCurrency === 'USD' ? (parseFloat(document.getElementById('input-rate').value) || 32.0) : 1;

      let newData = {};
      if (currentType === 'cash') {
        if (currentCashMode === 'shares') {
          const shares = parseFloat(document.getElementById('input-shares').value) || 0;
          const price = parseFloat(document.getElementById('input-price').value) || 0;
          newData = {
            type: 'cash',
            symbol: symbol,
            shares: shares,
            price: price,
            currency: currentCurrency,
            rate: rate,
            isSharesMode: true
          };
        } else {
          const val = parseFloat(document.getElementById('input-total-val').value) || 0;
          newData = {
            type: 'cash',
            symbol: symbol,
            val: val,
            currency: currentCurrency,
            rate: rate,
            isSharesMode: false
          };
        }
      } else {
        const shares = parseFloat(document.getElementById('input-shares').value) || 0;
        const price = parseFloat(document.getElementById('input-price').value) || 0;
        newData = {
          type: currentType,
          symbol: symbol,
          shares: shares,
          price: price,
          currency: currentCurrency,
          rate: rate,
          multiple: currentType === 'leverage' ? currentLevMultiple : undefined
        };
      }

      if (editingAssetId !== null) {
        assets = assets.map(a => a.id === editingAssetId ? { ...a, ...newData } : a);
      } else {
        assets.push({ id: Date.now(), ...newData });
      }

      renderAssets();
      closeSheet();

      const keyMap = { original: 'orig', leverage: 'lev', cash: 'cash' };
      const targetKey = keyMap[currentType];
      if (targetKey) {
        const body = document.getElementById(`body-${targetKey}`);
        const arrow = document.getElementById(`arrow-${targetKey}`);
        if (body && !body.classList.contains('open')) {
          body.classList.add('open');
          if (arrow) arrow.classList.add('open');
        }
      }
    }

    function executeDeleteAsset() {
      if (editingAssetId !== null) {
        assets = assets.filter(a => a.id !== editingAssetId);
        renderAssets();
        closeSheet();
      }
    }

    window.onload = function() {
      renderAssets();
    };
  </script>

  <!-- 引入統一背景與導覽列腳本 -->
  <script src="glow.js"></script>
  <script src="nav.js"></script>

</body>
</html>
