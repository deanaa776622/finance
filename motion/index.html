<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Finance — One Object Motion</title>
<style>
  @font-face {
    font-family: "Geist";
    src: local("Geist"), local("Geist Variable"), local("Inter");
    font-weight: 100 900;
    font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1440px;
    height: 1440px;
    overflow: hidden;
    background: #E8E4DE;
    font-family: "Geist", "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: relative;
    width: 1440px;
    height: 1440px;
    background: #E8E4DE;
    overflow: hidden;
  }
  #camera {
    position: absolute;
    left: 720px;
    top: 720px;
    width: 0;
    height: 0;
    transform-origin: 0 0;
  }
  #shape {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -50%);
    background: #111111;
    color: #fff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    will-change: opacity, filter;
  }
  .label {
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .mono {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  #cursor {
    position: absolute;
    width: 22px;
    height: 22px;
    margin-left: -3px;
    margin-top: -2px;
    pointer-events: none;
    z-index: 20;
  }
  #cursor svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.28)); }
  #cursor .click-ring {
    position: absolute;
    left: 2px;
    top: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid rgba(17,17,17,.35);
    transform: scale(0);
    opacity: 0;
  }
  /* Button */
  .btn-label { font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
  /* Input */
  .input-row {
    width: 100%;
    height: 100%;
    padding: 0 18px 0 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .input-val { font-size: 22px; font-weight: 600; }
  .caret {
    display: inline-block;
    width: 2px;
    height: 22px;
    background: #2F6FED;
    margin-left: 2px;
    vertical-align: -3px;
  }
  .confirm {
    width: 32px;
    height: 32px;
    border-radius: 16px;
    background: #2F6FED;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .confirm svg { stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  /* Loader */
  .loader-ring {
    width: 28px;
    height: 28px;
  }
  /* Success */
  .success-check svg {
    stroke: #fff;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* Island / hero */
  .island {
    width: 100%;
    height: 100%;
    padding: 0 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .island-kicker {
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
  }
  .island-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .island-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2F6FED;
    display: inline-block;
    margin-right: 8px;
    vertical-align: 2px;
  }
  /* Tabs */
  .tabs-wrap {
    width: 100%;
    height: 100%;
    padding: 14px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tab-metrics {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 8px;
  }
  .tab-title { font-size: 12px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; opacity: .55; }
  .tab-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .tab-rail {
    position: relative;
    height: 36px;
    border-radius: 18px;
    background: rgba(255,255,255,.1);
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
  }
  .tab-pill {
    position: absolute;
    top: 3px;
    height: 30px;
    border-radius: 15px;
    background: #fff;
  }
  .tab-item {
    position: relative;
    z-index: 1;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,.7);
  }
  .tab-item.on { color: #111; }
  /* Chart */
  .chart-wrap {
    width: 100%;
    height: 100%;
    padding: 22px 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chart-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .chart-head .k { font-size: 12px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
  .chart-head .v { font-size: 20px; font-weight: 700; }
  .chart-svg { width: 100%; flex: 1; overflow: visible; }
  .tooltip {
    position: absolute;
    padding: 8px 12px;
    border-radius: 10px;
    background: #fff;
    color: #111;
    font-size: 12px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    white-space: nowrap;
    pointer-events: none;
  }
  .span-band {
    fill: rgba(47,111,237,.18);
  }
  /* Allocation */
  .alloc-wrap {
    width: 100%;
    height: 100%;
    padding: 22px 26px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .alloc-head { font-size: 12px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
  .bars { display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: center; }
  .bar-row { display: grid; grid-template-columns: 52px 1fr 48px; gap: 10px; align-items: center; }
  .bar-name { font-size: 13px; font-weight: 600; opacity: .85; }
  .bar-track { height: 10px; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; background: #fff; }
  .bar-fill.accent { background: #2F6FED; }
  .bar-pct { font-size: 12px; font-weight: 600; text-align: right; opacity: .7; }
  .chip {
    align-self: flex-start;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(47,111,237,.18);
    color: #9DB7F7;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid rgba(47,111,237,.35);
  }
  /* Progress */
  .prog-wrap {
    width: 100%;
    height: 100%;
    padding: 0 22px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .prog-meta { min-width: 72px; }
  .prog-meta .k { font-size: 11px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; opacity: .55; }
  .prog-meta .v { font-size: 18px; font-weight: 700; }
  .prog-track {
    position: relative;
    flex: 1;
    height: 8px;
    border-radius: 4px;
    background: rgba(255,255,255,.14);
  }
  .prog-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    border-radius: 4px;
    background: #2F6FED;
  }
  .prog-thumb {
    position: absolute;
    top: 50%;
    width: 22px;
    height: 22px;
    margin: -11px 0 0 -11px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  /* Toggle */
  .tog-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tog-rail {
    position: relative;
    width: 64px;
    height: 36px;
    border-radius: 18px;
    background: rgba(255,255,255,.18);
  }
  .tog-knob {
    position: absolute;
    top: 3px;
    width: 30px;
    height: 30px;
    border-radius: 15px;
    background: #fff;
  }
  .tog-caption {
    position: absolute;
    left: 50%;
    top: calc(100% + 18px);
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 600;
    color: #111;
    white-space: nowrap;
    opacity: 0;
  }
  /* Toast */
  .toast-row {
    width: 100%;
    height: 100%;
    padding: 0 22px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .toast-icon {
    width: 28px;
    height: 28px;
    border-radius: 14px;
    background: #2F6FED;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .toast-icon svg { stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .toast-text { font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<div id="stage">
  <div id="camera">
    <div id="shape">
      <!-- 0 Button -->
      <div class="layer" data-layer="button"><span class="btn-label">記一筆</span></div>

      <!-- 1 Input -->
      <div class="layer" data-layer="input">
        <div class="input-row">
          <div class="input-val mono" id="inputVal">1,250,000<span class="caret" id="caret"></span></div>
          <div class="confirm" id="confirmBtn">

        </div>
      </div>

      <!-- 2 Loader -->
      <div class="layer" data-layer="loader">
        <svg class="loader-ring" viewBox="0 0 28 28" id="loaderSvg">

          <circle id="loaderArc" cx="14" cy="14" r="11" fill="none" stroke="#fff" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="48 70" transform="rotate(-90 14 14)"/>

      <div class="layer" data-layer="success">

          </svg>
        </div>
      </div>

      <!-- 4 Island -->
      <div class="layer" data-layer="island">
        <div class="island">
          <div class="island-kicker"><span class="island-dot"></span>總淨值</div>
          <div class="island-value mono" id="islandVal">NT$ 4,820,000</div>
        </div>
      </div>

      <!-- 5 Tabs -->
      <div class="layer" data-layer="tabs">
        <div class="tabs-wrap">
          <div class="tab-metrics">
            <div>
              <div class="tab-title" id="tabTitle">總淨值</div>
              <div class="tab-value mono" id="tabValue">NT$ 4,820,000</div>
            </div>
          </div>
          <div class="tab-rail">
            <div class="tab-pill" id="tabPill"></div>
            <div class="tab-item" id="tab0">總淨值</div>
            <div class="tab-item" id="tab1">總曝險</div>
          </div>

      </div>

      <!-- 6 Chart -->
      <div class="layer" data-layer="chart">
        <div class="chart-wrap" style="position:relative">
          <div class="chart-head">
            <span class="k">趨勢 · 年</span>
            <span class="v mono" id="chartReadout">NT$ 4,820,000</span>
          </div>
          <svg class="chart-svg" viewBox="0 0 372 140" preserveAspectRatio="none">
            <defs>
              <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#2F6FED" stop-opacity="0.28"/>
                <stop offset="100%" stop-color="#2F6FED" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <rect id="spanBand" class="span-band" x="0" y="0" width="0" height="140" rx="4"/>
            <path id="areaPath" fill="url(#areaGrad)" d=""/>
            <path id="linePath" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d=""/>
            <line id="scrubA" x1="0" y1="8" x2="0" y2="132" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
            <line id="scrubB" x1="0" y1="8" x2="0" y2="132" stroke="rgba(47,111,237,.9)" stroke-width="1.5" opacity="0"/>
            <circle id="scrubDot" cx="0" cy="0" r="4.5" fill="#2F6FED" stroke="#fff" stroke-width="2"/>
          </svg>
          <div class="tooltip" id="chartTip">2025 · NT$ 4.82M</div>
        </div>
      </div>

      <!-- 7 Allocation -->
      <div class="layer" data-layer="alloc">
        <div class="alloc-wrap">
          <div class="alloc-head">配置</div>
          <div class="bars">
            <div class="bar-row"><div class="bar-name">原型</div><div class="bar-track"><div class="bar-fill" id="bar0"></div></div><div class="bar-pct mono">42%</div></div>
            <div class="bar-row"><div class="bar-name">槓桿</div><div class="bar-track"><div class="bar-fill accent" id="bar1"></div></div><div class="bar-pct mono">28%</div></div>
            <div class="bar-row"><div class="bar-name">現金</div><div class="bar-track"><div class="bar-fill" id="bar2"></div></div><div class="bar-pct mono">18%</div></div>
            <div class="bar-row"><div class="bar-name">其他</div><div class="bar-track"><div class="bar-fill" id="bar3"></div></div><div class="bar-pct mono">12%</div></div>
          </div>

      <!-- 8 Progress -->
      <div class="layer" data-layer="progress">

          </div>
          <div class="prog-track">

      <!-- 9 Toggle -->

      <!-- 10 Toast -->

    <div id="togCaption" class="tog-caption">隱藏金額</div>
    <div id="cursor">
      <div class="click-ring" id="clickRing"></div>
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path fill="#111" stroke="#fff" stroke-width="1.4"
          d="M5.5 3.2l12.2 8.1c.7.46.35 1.55-.48 1.55H11l-2.8 7.1c-.28.7-1.28.55-1.4-.2L5.5 3.2z"/>
      </svg>
    </div>
  </div>
</div>

<script>
(() => {
  const DURATION = 14;
  const BEAT = 0.5;
  const CX = 720, CY = 720;

  // ——— Springs (closed-form underdamped step) ———
  function stepResponse(dt, omega = 22, zeta = 0.92) {
    if (dt <= 0) return 0;
    if (zeta >= 0.999) return 1 - Math.exp(-omega * dt);
    const wd = omega * Math.sqrt(Math.max(1e-8, 1 - zeta * zeta));
    const e = Math.exp(-zeta * omega * dt);
    return 1 - e * (Math.cos(wd * dt) + ((zeta * omega) / wd) * Math.sin(wd * dt));
  }

  function springSeries(t, keys, omega = 22, zeta = 0.92) {
    // keys: [{t, v}] sorted; value is sum of independent step responses
    let v = keys[0].v;
    for (let i = 1; i < keys.length; i++) {
      v += (keys[i].v - keys[i - 1].v) * stepResponse(t - keys[i].t, omega, zeta);
    }
    return v;
  }

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }

  // Content visibility: exit then enter windows
  function contentOpacity(t, enter, exit) {
    // returns {opacity, blur}. enter<=0 means already settled (loop start).
    const IN = 0.10, OUT = 0.09;
    if (t < enter || t >= exit) return { opacity: 0, blur: 8 };
    const ei = enter <= 0 ? 1 : smooth(clamp((t - enter) / IN, 0, 1));
    const eo = smooth(clamp((exit - t) / OUT, 0, 1));
    const opacity = Math.min(ei, eo);
    const blur = lerp(8, 0, ei) + lerp(0, 8, 1 - eo);
    return { opacity, blur };
  }

  // Chart polyline (calm long-range)
  const CHART_PTS = [
    [0, 108], [40, 100], [80, 92], [120, 88], [160, 78],
    [200, 70], [240, 66], [280, 52], [320, 44], [372, 36]
  ];
  function chartPath() {
    return CHART_PTS.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
  }
  function chartArea() {
    return chartPath() + " L372 140 L0 140 Z";
  }
  function chartYAtX(x) {
    x = clamp(x, 0, 372);
    for (let i = 1; i < CHART_PTS.length; i++) {
      const a = CHART_PTS[i - 1], b = CHART_PTS[i];
      if (x <= b[0]) {
        const u = (x - a[0]) / (b[0] - a[0]);
        return lerp(a[1], b[1], u);
      }
    }
    return CHART_PTS[CHART_PTS.length - 1][1];
  }
  const lineLen = (() => {
    let L = 0;
    for (let i = 1; i < CHART_PTS.length; i++) {
      const a = CHART_PTS[i - 1], b = CHART_PTS[i];
      L += Math.hypot(b[0] - a[0], b[1] - a[1]);
    }
    return L;
  })();

  // ——— Timeline property keys (beat-aligned) ———
  // Shape size / radius / fill
  const W = [
    { t: 0.00, v: 168 }, { t: 0.50, v: 162 }, { t: 1.00, v: 320 },
    { t: 2.50, v: 48 }, { t: 3.50, v: 56 }, { t: 4.50, v: 380 },
    { t: 5.50, v: 380 }, { t: 7.00, v: 420 }, { t: 9.00, v: 400 },
    { t: 10.50, v: 360 }, { t: 11.50, v: 72 }, { t: 12.35, v: 320 },
    { t: 13.40, v: 168 }, { t: 14.00, v: 168 }
  ];
  const H = [
    { t: 0.00, v: 48 }, { t: 0.50, v: 46 }, { t: 1.00, v: 56 },
    { t: 2.50, v: 48 }, { t: 3.50, v: 56 }, { t: 4.50, v: 64 },
    { t: 5.50, v: 96 }, { t: 7.00, v: 220 }, { t: 9.00, v: 210 },
    { t: 10.50, v: 56 }, { t: 11.50, v: 40 }, { t: 12.35, v: 52 },
    { t: 13.40, v: 48 }, { t: 14.00, v: 48 }
  ];
  const R = [
    { t: 0.00, v: 24 }, { t: 1.00, v: 16 }, { t: 2.50, v: 24 },
    { t: 3.50, v: 28 }, { t: 4.50, v: 32 }, { t: 5.50, v: 28 },
    { t: 7.00, v: 28 }, { t: 9.00, v: 28 }, { t: 10.50, v: 20 },
    { t: 11.50, v: 20 }, { t: 12.35, v: 16 }, { t: 13.40, v: 24 },
    { t: 14.00, v: 24 }
  ];
  // Fill: 0 black, 1 white (island-like light chrome rare — keep dark for continuity)
  const FILL_L = [
    { t: 0, v: 0 }, { t: 14, v: 0 }
  ];

  // Camera — base ~1.55 so states fill the square; no will-change on scaled nodes
  const CAM_S = [
    { t: 0.00, v: 1.55 }, { t: 0.50, v: 1.62 }, { t: 1.00, v: 1.58 },
    { t: 2.50, v: 1.85 }, { t: 3.50, v: 2.05 }, { t: 4.50, v: 1.48 },
    { t: 5.50, v: 1.52 }, { t: 7.00, v: 1.32 }, { t: 8.00, v: 1.38 },
    { t: 9.00, v: 1.42 }, { t: 10.00, v: 1.48 }, { t: 10.50, v: 1.50 },
    { t: 11.50, v: 1.85 }, { t: 12.35, v: 1.55 }, { t: 13.40, v: 1.55 },
    { t: 14.00, v: 1.55 }
  ];
  const CAM_Y = [
    { t: 0, v: 0 }, { t: 7.0, v: -18 }, { t: 9.0, v: 0 },
    { t: 11.5, v: -8 }, { t: 12.3, v: 0 }, { t: 14, v: 0 }
  ];

  // Cursor absolute positions relative to shape center (camera space)
  // Intentional path through controls
  function cursorAt(t) {
    // Piecewise with springs between waypoints
    const pts = [
      { t: 0.00, x: 220, y: 180 },
      { t: 0.35, x: 8, y: 6 },          // over button
      { t: 0.50, x: 8, y: 10 },         // press
      { t: 0.70, x: 8, y: 6 },
      { t: 1.20, x: 110, y: 4 },        // input field
      { t: 1.90, x: 130, y: 4 },
      { t: 2.15, x: 138, y: 2 },        // confirm
      { t: 2.50, x: 138, y: 6 },        // click
      { t: 2.70, x: 90, y: 70 },        // back off for loader
      { t: 4.20, x: 40, y: 80 },
      { t: 5.10, x: 20, y: 8 },         // island hover
      { t: 5.70, x: 90, y: 28 },
      { t: 6.00, x: 95, y: 32 },        // click exposure tab
      { t: 6.20, x: 95, y: 28 },
      { t: 7.20, x: -160, y: -40 },     // chart left
      { t: 8.00, x: 40, y: -20 },       // scrub drag
      { t: 8.50, x: 120, y: -10 },      // span
      { t: 9.20, x: 40, y: 10 },
      { t: 10.00, x: 20, y: 70 },       // chip
      { t: 10.20, x: 20, y: 74 },
      { t: 10.70, x: -40, y: 0 },
      { t: 11.00, x: 60, y: 0 },        // progress drag
      { t: 11.40, x: 100, y: 0 },
      { t: 11.70, x: 8, y: 0 },
      { t: 12.00, x: 14, y: 2 },        // toggle
      { t: 12.20, x: 18, y: 2 },
      { t: 12.70, x: 160, y: 120 },
      { t: 13.50, x: 220, y: 180 },
      { t: 14.00, x: 220, y: 180 }
    ];
    const xs = pts.map(p => ({ t: p.t, v: p.x }));
    const ys = pts.map(p => ({ t: p.t, v: p.y }));
    return {
      x: springSeries(t, xs, 20, 0.93),
      y: springSeries(t, ys, 20, 0.93)
    };
  }

  function clickPulse(t) {
    // peaks at click moments
    const clicks = [0.50, 2.50, 6.00, 10.15, 12.05];
    let a = 0;
    for (const c of clicks) {
      const d = t - c;
      if (d >= 0 && d < 0.28) {
        const u = d / 0.28;
        a = Math.max(a, Math.sin(Math.PI * Math.min(u * 1.15, 1)) * (1 - u * 0.35));
      }
    }
    return a;
  }

  // Liquid tab pill: left & right edges independent
  function tabEdges(t) {
    // off: left 4–186, on exposure: left 190–372 (rail inner ~372 wide? use %)
    // Use normalized 0..1 for selected
    const sel = [
      { t: 0, v: 0 },
      { t: 6.00, v: 0 },
      { t: 6.05, v: 1 },
      { t: 14, v: 1 }
    ];
    // When moving right: leading (right) faster, trailing (left) slower
    const target = springSeries(t, sel, 1, 1); // unused — we drive edges from keys
    const leftKeys = [
      { t: 0, v: 0.02 }, { t: 6.00, v: 0.02 }, { t: 6.22, v: 0.51 }, { t: 14, v: 0.51 }
    ];
    const rightKeys = [
      { t: 0, v: 0.49 }, { t: 6.00, v: 0.49 }, { t: 6.10, v: 0.98 }, { t: 14, v: 0.98 }
    ];
    const L = springSeries(t, leftKeys, 16, 0.90);
    const R = springSeries(t, rightKeys, 24, 0.88);
    return { L, R, selected: R > 0.7 ? 1 : 0 };
  }

  // Toggle liquid knob
  function toggleEdges(t) {
    const leftKeys = [
      { t: 0, v: 3 }, { t: 12.00, v: 3 }, { t: 12.28, v: 31 }, { t: 14, v: 31 }
    ];
    const rightKeys = [
      { t: 0, v: 33 }, { t: 12.00, v: 33 }, { t: 12.12, v: 61 }, { t: 14, v: 61 }
    ];
    const L = springSeries(t, leftKeys, 18, 0.90);
    const R = springSeries(t, rightKeys, 26, 0.88);
    return { L, R, on: (L + R) / 2 > 32 };
  }

  // Progress value driven by cursor during drag window
  function progressValue(t) {
    // before drag ~0.42, drag 11.0–11.4 maps cursor, then settle 0.68
    if (t < 10.9) return springSeries(t, [{ t: 0, v: 0.42 }, { t: 10.7, v: 0.42 }], 18, 0.92);
    if (t >= 10.9 && t <= 11.40) {
      // direct manipulation: map from cursor x proxy
      const u = (t - 10.9) / 0.5;
      return lerp(0.42, 0.68, clamp(u, 0, 1));
    }
    return springSeries(t, [
      { t: 0, v: 0.42 },
      { t: 11.40, v: 0.68 },
      { t: 14, v: 0.68 }
    ], 20, 0.92);
  }

  // Scrub / span on chart — direct from timeline mapped to x
  function scrubState(t) {
    let ax = 40, bx = 40, showB = 0, tip = 0;
    if (t >= 7.6 && t < 8.5) {
      const u = clamp((t - 7.6) / 0.9, 0, 1);
      ax = lerp(40, 210, u); // direct drag
      tip = smooth(clamp((t - 7.65) / 0.12, 0, 1));
    } else if (t >= 8.5 && t < 9.0) {
      ax = 210;
      const u = clamp((t - 8.5) / 0.45, 0, 1);
      bx = lerp(210, 310, u);
      showB = smooth(u);
      tip = 1;
    } else if (t >= 7.4 && t < 7.6) {
      ax = 40;
      tip = smooth((t - 7.4) / 0.2);
    } else if (t >= 9.0) {
      ax = springSeries(t, [{ t: 9.0, v: 210 }, { t: 9.3, v: 210 }], 18, 0.92);
      bx = springSeries(t, [{ t: 9.0, v: 310 }, { t: 9.3, v: 310 }], 18, 0.92);
      showB = clamp(1 - (t - 9.0) / 0.25, 0, 1);
      tip = showB;
    }
    return { ax, bx, showB, tip };
  }

  // DOM refs
  const shape = document.getElementById("shape");
  const camera = document.getElementById("camera");
  const cursor = document.getElementById("cursor");
  const clickRing = document.getElementById("clickRing");
  const layers = [...document.querySelectorAll(".layer")];
  const layerMap = Object.fromEntries(layers.map(el => [el.dataset.layer, el]));

  const linePath = document.getElementById("linePath");
  const areaPath = document.getElementById("areaPath");
  linePath.setAttribute("d", chartPath());
  areaPath.setAttribute("d", chartArea());
  linePath.style.strokeDasharray = String(lineLen);
  areaPath.style.opacity = "0";

  const inputDigits = "1,250,000";

  function setLayer(name, t, enter, exit) {
    const el = layerMap[name];
    const { opacity, blur } = contentOpacity(t, enter, exit);
    el.style.opacity = opacity.toFixed(4);
    el.style.filter = opacity > 0.01 ? `blur(${blur.toFixed(2)}px)` : "none";
    el.style.visibility = opacity > 0.001 ? "visible" : "hidden";
  }

  function seek(tRaw) {
    // Loop-safe: map into [0, DURATION)
    let t = ((tRaw % DURATION) + DURATION) % DURATION;
    // Near end, also evaluate continuity by using exact t for springs keyed at 14
    // For display use t; springs include t=14 keys matching t=0

    const w = springSeries(t, W, 21, 0.91);
    const h = springSeries(t, H, 19, 0.91);
    const r = springSeries(t, R, 22, 0.92);
    const camS = springSeries(t, CAM_S, 16, 0.93);
    const camY = springSeries(t, CAM_Y, 14, 0.93);

    shape.style.width = w.toFixed(2) + "px";
    shape.style.height = h.toFixed(2) + "px";
    shape.style.borderRadius = r.toFixed(2) + "px";
    shape.style.background = "#111111";

    // Press scale feel on button (extra)
    let press = 1;
    if (t >= 0.48 && t < 0.85) {
      press = lerp(1, 0.97, stepResponse(t - 0.48, 28, 0.85));
      if (t > 0.62) press = lerp(press, 1, stepResponse(t - 0.62, 22, 0.9));
    }

    camera.style.transform =
      `translate(${camY * 0}px, ${camY.toFixed(2)}px) scale(${(camS * press).toFixed(4)})`;

    // Layers enter/exit windows (no overlap of text)
    // Button spans loop seam: visible at t∈[0,1) and t∈[13.55,14)
    {
      const el = layerMap.button;
      let opacity = 0, blur = 8;
      if (t < 1.00) {
        ({ opacity, blur } = contentOpacity(t, 0, 1.00));
      } else if (t >= 13.40) {
        // settle fully by ~13.7 so seek(0) matches with velocity≈0
        const u = smooth(clamp((t - 13.40) / 0.28, 0, 1));
        opacity = u;
        blur = lerp(8, 0, u);
      }
      el.style.opacity = opacity.toFixed(4);
      el.style.filter = opacity > 0.01 ? `blur(${blur.toFixed(2)}px)` : "none";
      el.style.visibility = opacity > 0.001 ? "visible" : "hidden";
    }
    setLayer("input", t, 1.05, 2.45);
    setLayer("loader", t, 2.55, 3.45);
    setLayer("success", t, 3.52, 4.45);
    setLayer("island", t, 4.60, 5.45);
    setLayer("tabs", t, 5.55, 6.95);
    setLayer("chart", t, 7.05, 8.95);
    setLayer("alloc", t, 9.15, 10.50);
    setLayer("progress", t, 10.55, 11.45);
    setLayer("toggle", t, 11.55, 12.38);
    setLayer("toast", t, 12.42, 13.38);

    // Input typing reveal (finishes before confirm click)
    if (t >= 1.05 && t < 2.45) {
      const typed = clamp((t - 1.08) / 0.55, 0, 1);
      const n = Math.max(1, Math.ceil(typed * inputDigits.length));
      const shown = inputDigits.slice(0, n);
      const caret = document.getElementById("caret");
      const holder = document.getElementById("inputVal");
      holder.childNodes[0].textContent = shown;
      caret.style.opacity = (t < 1.95 && (Math.floor(t * 5) % 2 === 0)) ? "1" : "0";
      const conf = document.getElementById("confirmBtn");
      conf.style.opacity = t >= 1.70 ? "1" : "0";
      conf.style.transform =
        `scale(${springSeries(t, [{ t: 0, v: 0.8 }, { t: 1.70, v: 1 }], 26, 0.85).toFixed(3)})`;
    }

    // Loader rotation (pure function of t)
    const arc = document.getElementById("loaderArc");
    if (t >= 2.5 && t < 3.55) {
      const rot = ((t - 2.5) / 1.0) * 360 * 1.6;
      arc.setAttribute("transform", `rotate(${(-90 + rot).toFixed(2)} 14 14)`);
    }

    // Success check draw
    const check = document.getElementById("checkPath");
    if (t >= 3.5 && t < 4.5) {
      const s = stepResponse(t - 3.52, 24, 0.88);
      check.style.strokeDasharray = "1";
      check.style.strokeDashoffset = String(1 - clamp(s, 0, 1));
      layerMap.success.style.transform = `scale(${lerp(0.88, 1, s).toFixed(3)})`;
    } else {
      check.style.strokeDasharray = "1";
      check.style.strokeDashoffset = t < 3.5 ? "1" : "0";
      layerMap.success.style.transform = "none";
    }

    // Tabs liquid
    const te = tabEdges(t);
    const pill = document.getElementById("tabPill");
    const railW = Math.max(w - 40, 1);
    const leftPx = te.L * railW;
    const rightPx = te.R * railW;
    pill.style.left = leftPx.toFixed(2) + "px";
    pill.style.width = Math.max(0, rightPx - leftPx).toFixed(2) + "px";
    const selExp = te.R > 0.72;
    document.getElementById("tab0").classList.toggle("on", !selExp);
    document.getElementById("tab1").classList.toggle("on", selExp);
    if (t >= 5.55 && t < 6.95) {
      document.getElementById("tabTitle").textContent = selExp ? "總曝險" : "總淨值";
      document.getElementById("tabValue").textContent = selExp ? "NT$ 6,140,000" : "NT$ 4,820,000";
    }

    // Chart draw + scrub
    if (t >= 7.0 && t < 9.1) {
      const drawU = clamp((t - 7.15) / 0.55, 0, 1);
      const drawn = stepResponse(drawU * 0.6, 18, 0.95);
      const dash = lineLen * (1 - clamp(drawn, 0, 1));
      linePath.style.strokeDashoffset = String(dash);
      areaPath.style.opacity = String(0.9 * clamp(drawn, 0, 1));
      const sc = scrubState(t);
      const y = chartYAtX(sc.ax);
      document.getElementById("scrubA").setAttribute("x1", sc.ax);
      document.getElementById("scrubA").setAttribute("x2", sc.ax);
      document.getElementById("scrubA").style.opacity = sc.tip > 0 ? "1" : "0";
      document.getElementById("scrubDot").setAttribute("cx", sc.ax);
      document.getElementById("scrubDot").setAttribute("cy", y);
      document.getElementById("scrubDot").style.opacity = sc.tip > 0 ? "1" : "0";
      document.getElementById("scrubB").setAttribute("x1", sc.bx);
      document.getElementById("scrubB").setAttribute("x2", sc.bx);
      document.getElementById("scrubB").style.opacity = String(sc.showB);
      const band = document.getElementById("spanBand");
      band.setAttribute("x", Math.min(sc.ax, sc.bx));
      band.setAttribute("width", Math.abs(sc.bx - sc.ax) * sc.showB);
      const tip = document.getElementById("chartTip");
      tip.style.opacity = String(sc.tip);
      tip.style.left = (24 + sc.ax * (w - 48) / 372 - 40).toFixed(1) + "px";
      tip.style.top = "48px";
      tip.textContent = sc.showB > 0.5 ? "Δ +12.4% · 冷靜區間" : "2025 · NT$ 4.82M";
      document.getElementById("chartReadout").textContent =
        sc.showB > 0.5 ? "NT$ 4,820,000" : "NT$ 4,820,000";
    } else {
      linePath.style.strokeDashoffset = String(lineLen);
      areaPath.style.opacity = "0";
      document.getElementById("chartTip").style.opacity = "0";
      document.getElementById("scrubA").style.opacity = "0";
      document.getElementById("scrubB").style.opacity = "0";
      document.getElementById("scrubDot").style.opacity = "0";
    }

    // Allocation bars
    if (t >= 9.1 && t < 10.5) {
      const targets = [0.42, 0.28, 0.18, 0.12];
      targets.forEach((tv, i) => {
        const s = springSeries(t, [
          { t: 0, v: 0 },
          { t: 9.20 + i * 0.06, v: tv }
        ], 18, 0.9);
        document.getElementById("bar" + i).style.width = (clamp(s, 0, 1) * 100).toFixed(1) + "%";
      });
      const chip = document.getElementById("driftChip");
      const cs = springSeries(t, [{ t: 0, v: 0 }, { t: 9.75, v: 1 }], 20, 0.9);
      chip.style.opacity = clamp(cs, 0, 1).toFixed(3);
      chip.style.transform = `translateY(${lerp(8, 0, clamp(cs, 0, 1)).toFixed(1)}px)`;
    }

    // Progress
    const pv = progressValue(t);
    if (t >= 10.5 && t < 11.5) {
      document.getElementById("progFill").style.width = (pv * 100).toFixed(2) + "%";
      document.getElementById("progThumb").style.left = (pv * 100).toFixed(2) + "%";
      const years = Math.round(lerp(12, 8, pv));
      document.getElementById("progLabel").textContent = years + " 年";
    }

    // Toggle
    const tg = toggleEdges(t);
    const knob = document.getElementById("togKnob");
    knob.style.left = tg.L.toFixed(2) + "px";
    knob.style.width = Math.max(4, tg.R - tg.L).toFixed(2) + "px";
    const rail = document.getElementById("togRail");
    rail.style.background = tg.on
      ? "rgba(47,111,237,0.95)"
      : "rgba(255,255,255,0.18)";
    const cap = document.getElementById("togCaption");
    if (t >= 11.55 && t < 12.35) {
      const capFade = t < 12.20 ? 1 : smooth(clamp((12.35 - t) / 0.15, 0, 1));
      cap.style.opacity = String(capFade);
      cap.textContent = tg.on ? "金額已隱藏" : "隱藏金額";
      cap.style.left = "0px";
      cap.style.top = (h / 2 + 22).toFixed(1) + "px";
      cap.style.transform = "translate(-50%, 0)";
    } else {
      cap.style.opacity = "0";
    }

    // Cursor
    const c = cursorAt(t);
    cursor.style.transform = `translate(${c.x.toFixed(2)}px, ${c.y.toFixed(2)}px)`;
    const pulse = clickPulse(t);
    clickRing.style.opacity = String(pulse * 0.85);
    clickRing.style.transform = `scale(${(0.6 + pulse * 1.8).toFixed(3)})`;
    // slight cursor depress on click
    const depress = pulse > 0.15 ? 0.92 : 1;
    cursor.style.transform += ` scale(${depress})`;
  }

  // Public API
  window.seek = seek;
  window.DURATION = DURATION;
  window.BEAT = BEAT;
  window.__frame = (t) => { seek(t); };

  // Default preview: scrub via hash or play
  const params = new URLSearchParams(location.search);
  if (params.has("t")) {
    seek(parseFloat(params.get("t")) || 0);
  } else if (params.get("play") === "1") {
    const t0 = performance.now();
    const loop = (now) => {
      const t = ((now - t0) / 1000) % DURATION;
      seek(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else {
    seek(0);
  }
})();
</script>
</body>
