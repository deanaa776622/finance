<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>首頁</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 頁面底層始終為深色底色 */
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden;
      background-color: #0f172a; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }

    /* 全螢幕主容器 */
    .app-viewport {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center;
      position: relative; overflow: hidden;
      touch-action: none; /* 防止 iOS 橡皮筋回彈 */
    }

    /* 核心卡片面板：預設全螢幕（滿版光暈），縮起後變圓弧矩形卡片 */
    .status-card {
      width: 100%;
      height: 100vh; /* 預設滿版佔滿全螢幕 */
      border-radius: 0px; /* 預設無圓角 */
      border: 1px solid rgba(255, 255, 255, 0);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      overflow: hidden; /* 關鍵：鎖定光暈背景，讓其隨卡片輪廓進行裁切與變形 */
      box-shadow: 0 0 0 rgba(0,0,0,0);
      
      transition: height 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  width 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  border-radius 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  margin 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.45s ease,
                  box-shadow 0.45s ease;
      cursor: pointer;
    }

    /* 卡片內部的專屬光暈背景承接容器 */
    .card-glow-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      background-color: #0f172a; /* 兜底深色 */
    }

    /* 內容層 */
    .status-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .status-text {
      font-size: 1.1rem; font-weight: 600; letter-spacing: 0.2em;
      color: #f8fafc; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      transition: color 0.5s ease, transform 0.3s ease;
      user-select: none;
    }

    /* 底部提示 */
    .drag-hint {
      position: absolute; bottom: 20px;
      font-size: 0.72rem; color: rgba(255, 255, 255, 0.5); letter-spacing: 0.1em;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 1;
    }

    /* ─── 往上滑動後的縮起狀態 (.collapsed) ─── */
    .app-viewport.collapsed .status-card {
      height: 180px; /* 向上縮為矩形面板 */
      width: calc(100% - 40px); /* 兩側留出空間 */
      max-width: 400px;
      margin-top: 15px;
      border-radius: 28px; /* 光暈背景跟著收縮裁切成圓弧矩形！ */
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .app-viewport.collapsed .drag-hint {
      opacity: 0;
    }

    /* ─── 縮起後，矩形外的下方深色底內容區 ─── */
    .content-panel {
      width: 100%; max-width: 400px; flex: 1;
      padding: 16px 20px calc(85px + env(safe-area-inset-bottom)) 20px;
      overflow-y: auto;
      z-index: 1;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.4s ease 0.1s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }

    .app-viewport.collapsed .content-panel {
      opacity: 1;
      transform: translateY(0);
    }

    /* 矩形外部深色區塊上的卡片樣式 */
    .info-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .info-card-title {
      font-size: 0.75rem; font-weight: 600; color: #64748b;
      letter-spacing: 0.05em; margin-bottom: 6px;
    }
    .info-card-value {
      font-size: 0.95rem; font-weight: 600; color: #cbd5e1; line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-viewport" id="app-viewport">
    
    <!-- 全螢幕 ➔ 縮成光暈圓弧矩形卡片 -->
    <div class="status-card" id="status-card">
      <!-- 此處為光暈背景層，會跟隨 status-card 一起變形與裁切 -->
      <div class="card-glow-bg" id="card-glow-bg"></div>

      <!-- 文字內容 -->
      <div class="status-content">
        <span id="status-text" class="status-text">BALANCED</span>
      </div>

      <div class="drag-hint">▲ 往上滑動展開儀表板</div>
    </div>

    <!-- 矩形卡片外部的深色底內容區 -->
    <div class="content-panel" id="content-panel">
      <div class="info-card">
        <div class="info-card-title">資產狀態總覽</div>
        <div class="info-card-value">系統運作正常</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">即時訊息通知</div>
        <div class="info-card-value">
          目前資產配置未達偏離警示門檻（10%），建議繼續保持當前策略。
        </div>
      </div>
    </div>

  </div>

  <!-- 引入背景光暈與導覽列 -->
  <script src="glow.js"></script>
  <script src="nav.js"></script>

  <script>
    window.onload = function() {
      // 呼叫 glow.js 統一函式並更新狀態文字
      const maxDiff = typeof updateGlowBackground === 'function' ? updateGlowBackground() : 0;
      const statusText = document.getElementById('status-text');
      statusText.innerText = (maxDiff >= 10) ? 'ATTENTION' : 'BALANCED';

      // 將原本掛載在 body 的 glow 元素搬移至 status-card 內
      attachGlowToCard();

      initGestureEngine();
    };

    /* 將 glow.js 動態產生的 Canvas/Glow 搬移至卡片內部 */
    function attachGlowToCard() {
      const cardGlowContainer = document.getElementById('card-glow-bg');
      
      // 抓取 glow.js 產生的 canvas 或背景元素
      const glowElement = document.querySelector('canvas') || document.querySelector('.glow-container');
      
      if (glowElement && glowElement.parentElement !== cardGlowContainer) {
        cardGlowContainer.appendChild(glowElement);
        glowElement.style.position = 'absolute';
        glowElement.style.top = '0';
        glowElement.style.left = '0';
        glowElement.style.width = '100%';
        glowElement.style.height = '100%';
        glowElement.style.pointerEvents = 'none';
      }
    }

    /* 觸控手勢滑動引擎 */
    function initGestureEngine() {
      const viewport = document.getElementById('app-viewport');
      const card = document.getElementById('status-card');
      
      let startY = 0;
      let isDragging = false;

      card.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        isDragging = true;
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        
        const endY = e.changedTouches[0].clientY;
        const diffY = startY - endY;

        // 向上滑動超過 30px ➔ 光暈隨卡片縮成圓弧矩形
        if (diffY > 30) {
          viewport.classList.add('collapsed');
        } 
        // 向下滑動超過 30px ➔ 光暈展開回滿版全螢幕
        else if (diffY < -30) {
          viewport.classList.remove('collapsed');
        }
      });

      // 點擊卡片本體亦可切換狀態
      card.addEventListener('click', () => {
        viewport.classList.toggle('collapsed');
      });
    }
  </script>
</body>
</html>
