<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>首頁</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 滿版背景容器 */
    .glow-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
    }

    /* 藍、綠、黃三個流動光暈球體 */
    .blob {
      position: absolute;
      width: 90vw;
      height: 90vw;
      max-width: 600px;
      max-height: 600px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.85;
      mix-blend-mode: screen;
      transition: background 0.8s ease;
    }

    /* 原型 (預設藍) */
    .blob-original {
      top: 10%;
      left: 10%;
      animation: smoothRotateOriginal 22s linear infinite;
    }

    /* 槓桿 (預設綠) */
    .blob-leverage {
      top: 10%;
      right: 10%;
      animation: smoothRotateLeverage 28s linear infinite;
    }

    /* 現金 (預設黃) */
    .blob-cash {
      bottom: 0%;
      left: 20%;
      animation: smoothRotateCash 25s linear infinite;
    }

    /* 無縫旋轉軌跡 */
    @keyframes smoothRotateOriginal {
      0% { transform: rotate(0deg) translate(-20vw, -15vh) rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) translate(-20vw, -15vh) rotate(-180deg) scale(1.2); }
      100% { transform: rotate(360deg) translate(-20vw, -15vh) rotate(-360deg) scale(1); }
    }

    @keyframes smoothRotateLeverage {
      0% { transform: rotate(0deg) translate(25vw, -10vh) rotate(0deg) scale(1.1); }
      50% { transform: rotate(-180deg) translate(25vw, -10vh) rotate(180deg) scale(0.9); }
      100% { transform: rotate(-360deg) translate(25vw, -10vh) rotate(-360deg) scale(1.1); }
    }

    @keyframes smoothRotateCash {
      0% { transform: rotate(0deg) translate(0vw, 25vh) rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) translate(0vw, 25vh) rotate(-180deg) scale(1.15); }
      100% { transform: rotate(360deg) translate(0vw, 25vh) rotate(-360deg) scale(0.95); }
    }

    /* 中央極簡純文字顯示層 */
    .status-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      pointer-events: none;
    }

    .status-text {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #f8fafc;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      transition: color 0.5s ease;
    }
  </style>
</head>
<body>

  <!-- 流動光暈容器 -->
  <div class="glow-container">
    <div id="blob-original" class="blob blob-original"></div>
    <div id="blob-leverage" class="blob blob-leverage"></div>
    <div id="blob-cash" class="blob blob-cash"></div>
  </div>

  <!-- 中央極簡純文字顯示層 -->
  <div class="status-overlay">
    <span id="status-text" class="status-text">BALANCED</span>
  </div>

  <!-- 引入統一管理的導覽列腳本 -->
  <script src="nav.js"></script>

  <script>
    const COLOR_ORIGINAL = { r: 56,  g: 189, b: 248 };
    const COLOR_LEVERAGE = { r: 74,  g: 222, b: 128 };
    const COLOR_CASH     = { r: 250, g: 204, b: 21  };
    const COLOR_RED      = { r: 244, g: 63,  b: 94  };

    function parseNumber(formattedStr) {
      if (!formattedStr) return 0;
      return parseFloat(formattedStr.toString().replace(/,/g, '')) || 0;
    }

    function interpolateColor(baseColor, targetColor, factor) {
      const f = Math.min(Math.max(factor, 0), 1);
      const r = Math.round(baseColor.r + f * (targetColor.r - baseColor.r));
      const g = Math.round(baseColor.g + f * (targetColor.g - baseColor.g));
      const b = Math.round(baseColor.b + f * (targetColor.b - baseColor.b));
      return `rgba(${r}, ${g}, ${b}, 1)`;
    }

    function updateDashboard() {
      // 1. 讀取目標比例 (%)
      const tOrig = parseFloat(localStorage.getItem('target_original')) || 60;
      const tLev  = parseFloat(localStorage.getItem('target_leverage')) || 20;
      const tCash = parseFloat(localStorage.getItem('target_cash')) || 20;

      // 2. 讀取當前市值 (元)
      const aOrig = parseNumber(localStorage.getItem('alloc_original')) || 0;
      const aLev  = parseNumber(localStorage.getItem('alloc_leverage')) || 0;
      const aCash = parseNumber(localStorage.getItem('alloc_cash')) || 0;

      const total = aOrig + aLev + aCash;

      // 3. 計算當前比例 (%)
      let cOrig = 0, cLev = 0, cCash = 0;
      if (total > 0) {
        cOrig = (aOrig / total) * 100;
        cLev  = (aLev / total) * 100;
        cCash = (aCash / total) * 100;
      }

      // 4. 計算偏離幅度 (絕對值)
      const diffOrig = Math.abs(cOrig - tOrig);
      const diffLev  = Math.abs(cLev - tLev);
      const diffCash = Math.abs(cCash - tCash);

      // 找出最大偏離值
      const maxDiff = Math.max(diffOrig, diffLev, diffCash);

      // 5. 更新中央狀態文字
      const statusText = document.getElementById('status-text');

      if (maxDiff >= 10) {
        statusText.innerText = 'ATTENTION';
      } else {
        statusText.innerText = 'BALANCED';
      }

      // 6. 計算光暈漸變顏色
      const factorOrig = diffOrig / 10;
      const factorLev  = diffLev / 10;
      const factorCash = diffCash / 10;

      const colorOrigStr = interpolateColor(COLOR_ORIGINAL, COLOR_RED, factorOrig);
      const colorLevStr  = interpolateColor(COLOR_LEVERAGE, COLOR_RED, factorLev);
      const colorCashStr = interpolateColor(COLOR_CASH, COLOR_RED, factorCash);

      document.getElementById('blob-original').style.background = 
        `radial-gradient(circle, ${colorOrigStr} 0%, rgba(0,0,0,0) 70%)`;
      
      document.getElementById('blob-leverage').style.background = 
        `radial-gradient(circle, ${colorLevStr} 0%, rgba(0,0,0,0) 70%)`;

      document.getElementById('blob-cash').style.background = 
        `radial-gradient(circle, ${colorCashStr} 0%, rgba(0,0,0,0) 70%)`;
    }

    window.onload = function() {
      updateDashboard();
    };
  </script>

</body>
</html>
