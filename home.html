<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>首頁</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }

    /* 滿版背景容器 */
    .glow-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 藍、綠、黃三個流動光暈球體 */
    .blob {
      position: absolute;
      width: 90vw;
      height: 90vw;
      max-width: 600px;
      max-height: 600px;
      border-radius: 50%;
      filter: blur(70px); /* 增加模糊度，讓過渡極致柔和 */
      opacity: 0.8;
      mix-blend-mode: screen; /* 色彩和諧混合 */
    }

    /* 藍色光暈：左上方順時針圓形軌跡 */
    .blob-blue {
      background: radial-gradient(circle, rgba(56, 189, 248, 1) 0%, rgba(56, 189, 248, 0) 70%);
      top: 10%;
      left: 10%;
      animation: smoothRotateBlue 22s linear infinite;
    }

    /* 綠色光暈：右上方逆時針圓形軌跡 */
    .blob-green {
      background: radial-gradient(circle, rgba(74, 222, 128, 1) 0%, rgba(74, 222, 128, 0) 70%);
      top: 10%;
      right: 10%;
      animation: smoothRotateGreen 28s linear infinite;
    }

    /* 黃色光暈：下方順時針大圓弧軌跡 */
    .blob-yellow {
      background: radial-gradient(circle, rgba(250, 204, 21, 1) 0%, rgba(250, 204, 21, 0) 70%);
      bottom: 0%;
      left: 20%;
      animation: smoothRotateYellow 25s linear infinite;
    }

    /* 100% 無縫接軌的無限順時針旋轉軌跡 */
    @keyframes smoothRotateBlue {
      0% {
        transform: rotate(0deg) translate(-20vw, -15vh) rotate(0deg) scale(1);
      }
      50% {
        transform: rotate(180deg) translate(-20vw, -15vh) rotate(-180deg) scale(1.2);
      }
      100% {
        transform: rotate(360deg) translate(-20vw, -15vh) rotate(-360deg) scale(1);
      }
    }

    /* 100% 無縫接軌的無限逆時針旋轉軌跡 */
    @keyframes smoothRotateGreen {
      0% {
        transform: rotate(0deg) translate(25vw, -10vh) rotate(0deg) scale(1.1);
      }
      50% {
        transform: rotate(-180deg) translate(25vw, -10vh) rotate(180deg) scale(0.9);
      }
      100% {
        transform: rotate(-360deg) translate(25vw, -10vh) rotate(360deg) scale(1.1);
      }
    }

    /* 100% 無縫接軌的無限橢圓旋轉軌跡 */
    @keyframes smoothRotateYellow {
      0% {
        transform: rotate(0deg) translate(0vw, 25vh) rotate(0deg) scale(0.95);
      }
      50% {
        transform: rotate(180deg) translate(0vw, 25vh) rotate(-180deg) scale(1.15);
      }
      100% {
        transform: rotate(360deg) translate(0vw, 25vh) rotate(-360deg) scale(0.95);
      }
    }
  </style>
</head>
<body>

  <!-- 流動光暈容器 -->
  <div class="glow-container">
    <div class="blob blob-blue"></div>
    <div class="blob blob-green"></div>
    <div class="blob blob-yellow"></div>
  </div>

  <!-- 引入統一管理的導覽列腳本 -->
  <script src="nav.js"></script>

</body>
</html>
