<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>首頁</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }

    /* 滿版漸層光暈背景層 */
    .glow-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      /* 三等份面積的柔和光暈配置：左上藍、右上綠、底部中央黃 */
      background: 
        radial-gradient(circle at 20% 30%, rgba(56, 189, 248, 0.85) 0%, rgba(56, 189, 248, 0) 60%),
        radial-gradient(circle at 80% 30%, rgba(74, 222, 128, 0.85) 0%, rgba(74, 222, 128, 0) 60%),
        radial-gradient(circle at 50% 80%, rgba(250, 204, 21, 0.85) 0%, rgba(250, 204, 21, 0) 60%);
      /* 高度模糊讓交界處呈光暈般自然暈染 */
      filter: blur(40px);
      transform: scale(1.1); /* 避免模糊邊緣露出黑邊 */
    }
  </style>
</head>
<body>

  <!-- 光暈背景 (無任何文字與卡片) -->
  <div class="glow-background"></div>

  <!-- 引入統一管理的導覽列腳本 -->
  <script src="nav.js"></script>

</body>
</html>
