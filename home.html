<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>首頁</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }

    /* 全螢幕主容器 */
    .app-viewport {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center;
      position: relative; overflow: hidden;
      touch-action: none; /* 防止原生頁面橡皮筋滾動 */
    }

    /* 核心卡片面板：預設全螢幕無圓角 */
    .status-card {
      width: 100%;
      height: 100vh; /* 預設佔滿全螢幕 */
      background: rgba(30, 41, 59, 0.2); /* 預設微透明，露出全螢幕 glow.js 背景 */
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      border-radius: 0px; /* 預設無圓角 */
      border: 1px solid rgba(255, 255, 255, 0);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      transition: height 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  border-radius 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.45s ease,
                  backdrop-filter 0.45s ease,
                  border-color 0.45s ease,
                  margin 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    /* 狀態文字 */
    .status-text {
      font-size: 1.1rem; font-weight: 600; letter-spacing: 0.2em;
      color: #f8fafc; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      transition: color 0.5s ease, transform 0.3s ease;
      user-select: none;
    }

    /* 底部引導小指示條 */
    .drag-hint {
      position: absolute; bottom: 20px;
      font-size: 0.72rem; color: #64748b; letter-spacing: 0.1em;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    /* ─── 往上滑動後的收折狀態 (.collapsed) ─── */
    .app-viewport.collapsed .status-card {
      height: 180px; /* 向上縮為精緻面板 */
      width: calc(100% - 40px); /* 兩側留出邊界 */
      max-width: 400px;
      margin-top: 15px;
      border-radius: 28px; /* 變成圓弧矩形！ */
      background: rgba(30, 41, 59, 0.45); /* 顯現 index.html 風格的玻璃色澤 */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .app-viewport.collapsed .drag-hint {
      opacity: 0; /* 縮起後隱藏提示 */
    }

    /* ─── 下方出現的內容區 ─── */
    .content-panel {
      width: 100%; max-width: 400px; flex: 1;
      padding: 16px 20px calc(85px + env(safe-area-inset-bottom)) 20px;
      overflow-y: auto;
      z-index: 1;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.4s ease 0.1s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }

    .app-viewport.collapsed .content-panel {
      opacity: 1;
      transform: translateY(0);
    }

    /* 下方卡片質感（對齊 index.html） */
    .info-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .info-card-title {
      font-size: 0.75rem; font-weight: 600; color: #64748b;
      letter-spacing: 0.05em; margin-bottom: 6px;
    }
    .info-card-value {
      font-size: 0.95rem; font-weight: 600; color: #cbd5e1; line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-viewport" id="app-viewport">
    
    <!-- 全螢幕 ➔ 往上縮成圓弧矩形的卡片面板 -->
    <div class="status-card" id="status-card">
      <span id="status-text" class="status-text">BALANCED</span>
      <div class="drag-hint">▲ 往上滑動展開儀表板</div>
    </div>

    <!-- 縮起後下方顯示的資訊區 -->
    <div class="content-panel" id="content-panel">
      <div class="info-card">
        <div class="info-card-title">資產狀態總覽</div>
        <div class="info-card-value">系統運作正常</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">即時訊息通知</div>
        <div class="info-card-value">
          目前資產配置未達偏離警示門檻（10%），建議繼續保持當前策略。
        </div>
      </div>
    </div>

  </div>

  <!-- 引入背景光暈與導覽列 -->
  <script src="glow.js"></script>
  <script src="nav.js"></script>

  <script>
    window.onload = function() {
      // 呼叫 glow.js 的統一函式，並更新狀態文字
      const maxDiff = typeof updateGlowBackground === 'function' ? updateGlowBackground() : 0;
      const statusText = document.getElementById('status-text');
      statusText.innerText = (maxDiff >= 10) ? 'ATTENTION' : 'BALANCED';

      initGestureEngine();
    };

    /* 觸控滑動手勢引擎 */
    function initGestureEngine() {
      const viewport = document.getElementById('app-viewport');
      const card = document.getElementById('status-card');
      
      let startY = 0;
      let isDragging = false;

      card.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        isDragging = true;
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        
        const endY = e.changedTouches[0].clientY;
        const diffY = startY - endY;

        // 向上滑動超過 30px ➔ 壓縮成圓弧矩形卡片
        if (diffY > 30) {
          viewport.classList.add('collapsed');
        } 
        // 向下滑動超過 30px ➔ 展開回滿版全螢幕
        else if (diffY < -30) {
          viewport.classList.remove('collapsed');
        }
      });

      // 點擊卡片本體亦可切換狀態
      card.addEventListener('click', () => {
        viewport.classList.toggle('collapsed');
      });
    }
  </script>
</body>
</html>
