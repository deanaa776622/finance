<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>首頁</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden;
      background-color: #0f172a; /* 底層基色 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }

    /* 全螢幕主容器 */
    .app-viewport {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center;
      position: relative; overflow: hidden;
      touch-action: none; /* 防止原生頁面橡皮筋滾動 */
    }

    /* 核心卡片面板：預設滿版，背景與光暈都在內部 */
    .status-card {
      width: 100%;
      height: 100vh; /* 預設佔滿全螢幕 */
      background: #0f172a; /* 預設滿版背景色 */
      border-radius: 0px; /* 預設無圓角 */
      border: 1px solid rgba(255, 255, 255, 0);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      overflow: hidden; /* 核心：鎖定內部背景與光暈，隨卡片邊界一併裁切縮放 */
      box-shadow: 0 0 0 rgba(0,0,0,0);
      
      transition: height 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  width 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  border-radius 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  margin 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.45s ease,
                  border-color 0.45s ease,
                  box-shadow 0.45s ease;
      cursor: pointer;
    }

    /* 卡片內部的背景光暈承接層 (給 glow.js 或 CSS 光暈使用) */
    .card-glow-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }

    /* 狀態文字內容層 */
    .status-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .status-text {
      font-size: 1.1rem; font-weight: 600; letter-spacing: 0.2em;
      color: #f8fafc; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      transition: color 0.5s ease, transform 0.3s ease;
      user-select: none;
    }

    /* 底部引導小指示條 */
    .drag-hint {
      position: absolute; bottom: 20px;
      font-size: 0.72rem; color: #64748b; letter-spacing: 0.1em;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 1;
    }

    /* ─── 往上滑動後的收折狀態 (.collapsed) ─── */
    .app-viewport.collapsed .status-card {
      height: 180px; /* 向上縮為精緻面板 */
      width: calc(100% - 40px); /* 兩側留出邊界 */
      max-width: 400px;
      margin-top: 15px;
      border-radius: 28px; /* 背景色與光暈跟著縮成圓弧矩形！ */
      background: rgba(30, 41, 59, 0.65); /* 縮起後的玻璃感背景色 */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .app-viewport.collapsed .drag-hint {
      opacity: 0; /* 縮起後隱藏提示 */
    }

    /* ─── 下方露出的內容區 ─── */
    .content-panel {
      width: 100%; max-width: 400px; flex: 1;
      padding: 16px 20px calc(85px + env(safe-area-inset-bottom)) 20px;
      overflow-y: auto;
      z-index: 1;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.4s ease 0.1s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }

    .app-viewport.collapsed .content-panel {
      opacity: 1;
      transform: translateY(0);
    }

    /* 下方卡片質感 */
    .info-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .info-card-title {
      font-size: 0.75rem; font-weight: 600; color: #64748b;
      letter-spacing: 0.05em; margin-bottom: 6px;
    }
    .info-card-value {
      font-size: 0.95rem; font-weight: 600; color: #cbd5e1; line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-viewport" id="app-viewport">
    
    <!-- 全螢幕卡片面板：內部包含背景與動態光暈容器 -->
    <div class="status-card" id="status-card">
      <!-- 原本全螢幕的背景光暈層（被包裹在卡片內，隨卡片一同收縮） -->
      <div class="card-glow-bg" id="card-glow-bg"></div>

      <!-- 文字內容 -->
      <div class="status-content">
        <span id="status-text" class="status-text">BALANCED</span>
      </div>

      <div class="drag-hint">▲ 往上滑動展開儀表板</div>
    </div>

    <!-- 縮起後下方顯示的資訊區 -->
    <div class="content-panel" id="content-panel">
      <div class="info-card">
        <div class="info-card-title">資產狀態總覽</div>
        <div class="info-card-value">系統運作正常</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">即時訊息通知</div>
        <div class="info-card-value">
          目前資產配置未達偏離警示門檻（10%），建議繼續保持當前策略。
        </div>
      </div>
    </div>

  </div>

  <!-- 引入背景光暈與導覽列 -->
  <script src="glow.js"></script>
  <script src="nav.js"></script>

  <script>
    window.onload = function() {
      // 呼叫 glow.js 的統一函式，並更新狀態文字
      const maxDiff = typeof updateGlowBackground === 'function' ? updateGlowBackground() : 0;
      const statusText = document.getElementById('status-text');
      statusText.innerText = (maxDiff >= 10) ? 'ATTENTION' : 'BALANCED';

      // 若 glow.js 生成了全頁 Canvas/Glow 元素，將其移動至 #card-glow-bg 或 #status-card 內部
      adaptGlowToCard();

      initGestureEngine();
    };

    /* 將 Glow 動態背景移入 status-card 內部的邏輯 */
    function adaptGlowToCard() {
      const card = document.getElementById('status-card');
      const cardGlowContainer = document.getElementById('card-glow-bg');
      
      // 搜尋 glow.js 在 body 下產生的背景元素 (例如 canvas 或 glow-container)
      const glowElement = document.querySelector('canvas') || document.querySelector('.glow-container');
      
      if (glowElement && glowElement.parentElement !== cardGlowContainer) {
        cardGlowContainer.appendChild(glowElement);
        // 確保 glow 元素覆蓋整個卡片內部
        glowElement.style.position = 'absolute';
        glowElement.style.top = '0';
        glowElement.style.left = '0';
        glowElement.style.width = '100%';
        glowElement.style.height = '100%';
      }
    }

    /* 觸控滑動手勢引擎 */
    function initGestureEngine() {
      const viewport = document.getElementById('app-viewport');
      const card = document.getElementById('status-card');
      
      let startY = 0;
      let isDragging = false;

      card.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        isDragging = true;
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        
        const endY = e.changedTouches[0].clientY;
        const diffY = startY - endY;

        // 向上滑動超過 30px ➔ 背景色與光暈一起壓縮成圓弧矩形卡片
        if (diffY > 30) {
          viewport.classList.add('collapsed');
        } 
        // 向下滑動超過 30px ➔ 展開回滿版全螢幕
        else if (diffY < -30) {
          viewport.classList.remove('collapsed');
        }
      });

      // 點擊卡片本體亦可切換狀態
      card.addEventListener('click', () => {
        viewport.classList.toggle('collapsed');
      });
    }
  </script>
</body>
</html>
