<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>首頁</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.45);
      --accent-color: #ffffff;
      --text-color: #f8fafc;
      --sub-text: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 全局邊界鎖定，防止 iOS 橡皮筋回彈 */
    html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      padding-bottom: calc(85px + env(safe-area-inset-bottom)) !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      max-height: calc(100dvh - 110px - env(safe-area-inset-bottom));
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }

    /* 圓弧毛玻璃卡片（對齊 index.html 的 tuner-card 樣式） */
    .status-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      position: relative;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 主主角：狀態文字（點擊或向上滑動切換展開/收折） */
    .hero-status {
      text-align: center;
      cursor: pointer;
      user-select: none;
      padding: 10px 0;
    }

    .status-text {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--text-color);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      transition: color 0.5s ease, transform 0.3s ease;
    }

    /* 點擊/滑動後動態展開的下方內容區 */
    .expandable-content {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease, padding-top 0.35s ease;
    }

    /* 展開狀態 (.expanded) 的卡片與內容樣式 */
    .status-card.expanded .expandable-content {
      max-height: 500px;
      opacity: 1;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      margin-top: 12px;
    }

    /* 資訊卡片內元件樣式 */
    .info-item {
      margin-bottom: 14px;
    }
    .info-item:last-child { margin-bottom: 0; }

    .info-label {
      font-size: 0.75rem;
      color: var(--sub-text);
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }

    .info-value {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container" id="main-container">
    <!-- 圓弧毛玻璃面板卡片 -->
    <div class="status-card" id="main-status-card">
      
      <!-- 中央核心狀態文字 (點擊或向上拖曳切換展開) -->
      <div class="hero-status" id="hero-status" onclick="toggleCardExpand(event)">
        <span id="status-text" class="status-text">BALANCED</span>
      </div>

      <!-- 向上滑動/點擊後展開呈現的下方資訊區 -->
      <div class="expandable-content" id="expandable-content">
        <div class="info-item">
          <div class="info-label">資產狀態總覽</div>
          <div class="info-value">系統運作正常</div>
        </div>

        <div class="info-item">
          <div class="info-label">即時訊息通知</div>
          <div class="info-value">
            目前資產配置未達偏離警示門檻（10%），建議繼續保持當前策略。
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 引入背景光暈與導覽列 -->
  <script src="glow.js"></script>
  <script src="nav.js"></script>

  <script>
    // 防止 iOS Safari 全域頁面橡皮筋滾動
    document.addEventListener('touchmove', function(e) {
      if (!e.target.closest('.status-card')) {
        e.preventDefault();
      }
    }, { passive: false });

    // 切換面板展開/縮起
    function toggleCardExpand(e) {
      if (e) e.stopPropagation();
      const card = document.getElementById('main-status-card');
      card.classList.toggle('expanded');
    }

    // 觸控手勢滑動邏輯（往上滑展開，往下滑收折）
    function initGesture() {
      const hero = document.getElementById('hero-status');
      const card = document.getElementById('main-status-card');
      let startY = 0;
      let isDragging = false;

      hero.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        isDragging = true;
      }, { passive: true });

      hero.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        
        const endY = e.changedTouches[0].clientY;
        const diffY = startY - endY;

        // 向上滑動超過 30px ➔ 展開面板
        if (diffY > 30) {
          card.classList.add('expanded');
        } 
        // 向下滑動超過 30px ➔ 收折面板
        else if (diffY < -30) {
          card.classList.remove('expanded');
        }
      });
    }

    window.onload = function() {
      // 呼叫 glow.js 的統一函式，並用回傳的最大偏離值更新狀態文字
      const maxDiff = typeof updateGlowBackground === 'function' ? updateGlowBackground() : 0;
      const statusText = document.getElementById('status-text');
      statusText.innerText = (maxDiff >= 10) ? 'ATTENTION' : 'BALANCED';

      initGesture();
    };
  </script>
</body>
</html>
