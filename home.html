<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>首頁</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 頁面底層始終為深色底色 (#0f172a) */
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden;
      background-color: #0f172a; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }

    /* 主視口容器 */
    .app-viewport {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center;
      position: relative; overflow: hidden;
      touch-action: none; /* 防止 iOS 橡皮筋回彈 */
    }

    /* 
      核心動態面板卡片 
      預設 (滿版): 佔據 100vw x 100vh，無圓角
    */
    .glow-card-panel {
      width: 100vw;
      height: 100vh;
      border-radius: 0px;
      border: 1px solid rgba(255, 255, 255, 0);
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      overflow: hidden; /* 關鍵：讓內部的光暈背景嚴格跟隨外框縮放與變形 */
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      cursor: pointer;

      /* 平滑收縮與邊角圓弧化動畫 */
      transition: height 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  width 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  border-radius 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  margin 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.45s ease,
                  box-shadow 0.45s ease;
    }

    /* 專屬內部光暈承載容器 */
    .glow-inner-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* 文字內容層 */
    .status-overlay-content {
      position: relative; z-index: 1; text-align: center;
    }

    .status-text {
      font-size: 1.1rem; font-weight: 600; letter-spacing: 0.2em;
      color: #f8fafc; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      transition: color 0.5s ease;
      user-select: none;
    }

    .drag-hint-text {
      position: absolute; bottom: 25px; z-index: 1;
      font-size: 0.72rem; color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.12em; transition: opacity 0.3s ease;
      pointer-events: none;
    }

    /* 
      ─── 往上滑動後的縮起狀態 (.collapsed) ─── 
      光暈背景會被嚴格限制與裁切在這個圓弧矩形卡片內部！
    */
    .app-viewport.collapsed .glow-card-panel {
      height: 180px;
      width: calc(100vw - 40px);
      max-width: 400px;
      margin-top: 15px;
      border-radius: 28px; /* 光暈背景跟隨邊界縮成圓弧矩形 */
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .app-viewport.collapsed .drag-hint-text {
      opacity: 0;
    }

    /* 
      ─── 縮起後，圓弧矩形外部露出的深色底資訊區 ─── 
    */
    .content-panel {
      width: 100%; max-width: 400px; flex: 1;
      padding: 16px 20px calc(85px + env(safe-area-inset-bottom)) 20px;
      overflow-y: auto;
      z-index: 1;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.4s ease 0.1s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }

    .app-viewport.collapsed .content-panel {
      opacity: 1;
      transform: translateY(0);
    }

    /* 下方卡片樣式 */
    .info-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .info-card-title {
      font-size: 0.75rem; font-weight: 600; color: #64748b;
      letter-spacing: 0.05em; margin-bottom: 6px;
    }
    .info-card-value {
      font-size: 0.95rem; font-weight: 600; color: #cbd5e1; line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-viewport" id="app-viewport">
    
    <!-- 動態光暈面板卡片 (預設滿版光暈 ➔ 縮起後光暈被限制在圓弧矩形內) -->
    <div class="glow-card-panel" id="glow-card-panel">
      <!-- 承接 glow.js 的專屬容器 -->
      <div class="glow-inner-container" id="glow-inner-container"></div>

      <div class="status-overlay-content">
        <span id="status-text" class="status-text">BALANCED</span>
      </div>

      <div class="drag-hint-text">▲ 往上滑動展開內容</div>
    </div>

    <!-- 縮起後下方露出的深色背景內容區 -->
    <div class="content-panel" id="content-panel">
      <div class="info-card">
        <div class="info-card-title">資產狀態總覽</div>
        <div class="info-card-value">系統運作正常</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">即時訊息通知</div>
        <div class="info-card-value">
          目前資產配置未達偏離警示門檻（10%），建議繼續保持當前策略。
        </div>
      </div>
    </div>

  </div>

  <!-- 引入背景光暈與導覽列 -->
  <script src="glow.js"></script>
  <script src="nav.js"></script>

  <script>
    window.onload = function() {
      // 1. 呼叫 glow.js 統一函式並更新狀態文字
      const maxDiff = typeof updateGlowBackground === 'function' ? updateGlowBackground() : 0;
      const statusText = document.getElementById('status-text');
      statusText.innerText = (maxDiff >= 10) ? 'ATTENTION' : 'BALANCED';

      // 2. 將原本掛載在全頁 body 的光暈元素，移入矩形卡片內部容器
      encapsulateGlowIntoCard();

      // 3. 初始化手勢監聽
      initGestureEngine();
    };

    /* 將 glow.js 產生的動態背景抓進矩形卡片容器內 */
    function encapsulateGlowIntoCard() {
      const container = document.getElementById('glow-inner-container');
      
      // 尋找 glow.js 在全頁產生的 Canvas 或 Glow 元素
      const glowElement = document.querySelector('canvas') || document.querySelector('.glow-container');
      
      if (glowElement) {
        container.appendChild(glowElement);
        glowElement.style.position = 'absolute';
        glowElement.style.top = '0';
        glowElement.style.left = '0';
        glowElement.style.width = '100%';
        glowElement.style.height = '100%';
        glowElement.style.pointerEvents = 'none';
      }
    }

    /* 觸控滑動手勢引擎 */
    function initGestureEngine() {
      const viewport = document.getElementById('app-viewport');
      const panel = document.getElementById('glow-card-panel');
      
      let startY = 0;
      let isDragging = false;

      panel.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        isDragging = true;
      }, { passive: true });

      panel.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        
        const endY = e.changedTouches[0].clientY;
        const diffY = startY - endY;

        // 向上滑動超過 30px ➔ 光暈無縫縮成圓弧矩形
        if (diffY > 30) {
          viewport.classList.add('collapsed');
        } 
        // 向下滑動超過 30px ➔ 光暈展開回滿版
        else if (diffY < -30) {
          viewport.classList.remove('collapsed');
        }
      });

      // 點擊面板亦可切換開合
      panel.addEventListener('click', () => {
        viewport.classList.toggle('collapsed');
      });
    }
  </script>
</body>
</html>
