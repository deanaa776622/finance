<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>首頁</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 頁面底層始終為深色底色 (#0f172a) */
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden;
      background-color: #0f172a; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }

    /* 視口容器 */
    .app-viewport {
      width: 100%; height: 100%;
      position: relative; overflow: hidden;
      touch-action: none;
    }

    /* 
      光暈卡片舞台 (Stage)
      預設滿版全螢幕，`clip-path` 展開為 full-screen
    */
    .glow-stage {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 2;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      cursor: pointer;
      
      /* 使用物理剪裁實現光暈與邊角收縮 */
      clip-path: inset(0px 0px 0px 0px round 0px);
      transition: clip-path 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.5s ease;
      
      /* 邊框光暈裝飾 (收縮後顯現) */
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0);
    }

    /* 卡片內部的光暈內容，收縮時配合微幅 scale 產生縮小擠壓感受 */
    .glow-stage-inner {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .status-text {
      font-size: 1.1rem; font-weight: 600; letter-spacing: 0.2em;
      color: #f8fafc; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      transition: color 0.5s ease, transform 0.3s ease;
      user-select: none;
      z-index: 3;
    }

    .drag-hint-text {
      position: absolute; bottom: 30px; z-index: 3;
      font-size: 0.72rem; color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.12em; transition: opacity 0.3s ease;
      pointer-events: none;
    }

    /* 
      ─── 往上滑動後的縮起狀態 (.collapsed) ─── 
      利用 clip-path 將光暈背景精準剪裁裁縮成頂部的圓弧矩形！
    */
    .app-viewport.collapsed .glow-stage {
      /* 上:15px, 右:20px, 下:calc(100vh - 195px), 左:20px，圓角:28px */
      clip-path: inset(15px 20px calc(100vh - 195px) 20px round 28px);
    }

    .app-viewport.collapsed .glow-stage-inner {
      /* 讓光暈色彩在視覺上有微幅向內收縮的動態感 */
      transform: scale(0.92) translateY(-35dvh);
    }

    .app-viewport.collapsed .status-text {
      transform: translateY(-38dvh);
    }

    .app-viewport.collapsed .drag-hint-text {
      opacity: 0;
    }

    /* 
      ─── 矩形外部露出的深色底資訊區 ─── 
    */
    .content-panel {
      position: absolute;
      top: 210px; left: 0; width: 100%;
      height: calc(100dvh - 210px);
      padding: 10px 20px calc(85px + env(safe-area-inset-bottom)) 20px;
      overflow-y: auto;
      z-index: 1;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.4s ease 0.1s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }

    .app-viewport.collapsed .content-panel {
      opacity: 1;
      transform: translateY(0);
    }

    /* 下方深色區域內的卡片樣式 */
    .info-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .info-card-title {
      font-size: 0.75rem; font-weight: 600; color: #64748b;
      letter-spacing: 0.05em; margin-bottom: 6px;
    }
    .info-card-value {
      font-size: 0.95rem; font-weight: 600; color: #cbd5e1; line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-viewport" id="app-viewport">
    
    <!-- 全螢幕 ➔ 剪裁縮放成光暈圓弧矩形卡片 -->
    <div class="glow-stage" id="glow-stage">
      <div class="glow-stage-inner" id="glow-stage-inner">
        <!-- glow.js 生成的背景會自然在此渲染 -->
      </div>
      <span id="status-text" class="status-text">BALANCED</span>
      <div class="drag-hint-text">▲ 往上滑動展開內容</div>
    </div>

    <!-- 縮起後，矩形卡片外部的深色底內容區 -->
    <div class="content-panel" id="content-panel">
      <div class="info-card">
        <div class="info-card-title">資產狀態總覽</div>
        <div class="info-card-value">系統運作正常</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">即時訊息通知</div>
        <div class="info-card-value">
          目前資產配置未達偏離警示門檻（10%），建議繼續保持當前策略。
        </div>
      </div>
    </div>

  </div>

  <!-- 引入背景光暈與導覽列 -->
  <script src="glow.js"></script>
  <script src="nav.js"></script>

  <script>
    window.onload = function() {
      // 1. 呼叫 glow.js 統一函式並更新狀態文字
      const maxDiff = typeof updateGlowBackground === 'function' ? updateGlowBackground() : 0;
      const statusText = document.getElementById('status-text');
      statusText.innerText = (maxDiff >= 10) ? 'ATTENTION' : 'BALANCED';

      // 2. 初始化滑動手勢
      initGestureEngine();
    };

    /* 觸控滑動手勢引擎 */
    function initGestureEngine() {
      const viewport = document.getElementById('app-viewport');
      const stage = document.getElementById('glow-stage');
      
      let startY = 0;
      let isDragging = false;

      stage.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        isDragging = true;
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        
        const endY = e.changedTouches[0].clientY;
        const diffY = startY - endY;

        // 向上滑動超過 30px ➔ 光暈無縫縮成圓弧矩形
        if (diffY > 30) {
          viewport.classList.add('collapsed');
        } 
        // 向下滑動超過 30px ➔ 光暈展開回滿版
        else if (diffY < -30) {
          viewport.classList.remove('collapsed');
        }
      });

      // 點擊舞台亦可切換開合
      stage.addEventListener('click', () => {
        viewport.classList.toggle('collapsed');
      });
    }
  </script>
</body>
</html>
