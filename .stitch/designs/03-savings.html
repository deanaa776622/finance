<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Savings — Calm Ledger</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
    }

    .layout {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--deep-ledger);
    }

    .hero-card {
      margin: 58px 16px 0;
      height: 148px;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      background: #10131a;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      flex-shrink: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(52px);
      opacity: 0.4;
    }
    .orb.a { width: 160px; height: 160px; background: var(--mist-teal); top: -30%; right: 5%; }
    .orb.b { width: 120px; height: 120px; background: var(--warm-sand); bottom: -40%; left: 15%; opacity: 0.28; }

    .hero-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding-bottom: 8px;
    }

    .hero-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--quiet);
    }

    .hero-years {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-family: "SF Pro Rounded", "SF Pro Display", "PingFang TC", sans-serif;
    }
    .hero-years span {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--quiet);
      margin-left: 6px;
    }

    .hero-detail {
      font-size: 13px;
      color: var(--quiet);
      margin-top: 2px;
    }

    .progress {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      background: rgba(244, 241, 236, 0.1);
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 38%;
      background: linear-gradient(90deg, rgba(91, 154, 168, 0.35), var(--accent));
      border-radius: 0 2px 2px 0;
      box-shadow: 0 0 10px rgba(91, 154, 168, 0.35);
    }

    .sheet {
      flex: 1;
      margin-top: 14px;
      padding: 0 16px 40px;
    }

    .group {
      margin-bottom: 14px;
    }

    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 6px 10px;
    }
    .group-head .t {
      font-size: 15px;
      font-weight: 600;
    }
    .group-head .v {
      font-size: 14px;
      color: var(--quiet);
    }
    .group-head .chev {
      color: rgba(244, 241, 236, 0.28);
      margin-left: 8px;
      font-size: 12px;
    }

    .card {
      background: var(--lifted);
      border-radius: 18px;
      overflow: hidden;
    }

    .field {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--whisper);
    }
    .field:first-child { border-top: none; }
    .field .label { font-size: 15px; color: var(--quiet); }
    .field .value {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .slider {
      padding: 4px 16px 16px;
    }
    .track {
      height: 4px;
      border-radius: 2px;
      background: rgba(244, 241, 236, 0.1);
      position: relative;
    }
    .track .fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 42%;
      border-radius: 2px;
      background: var(--accent);
      opacity: 0.85;
    }
    .track .thumb {
      position: absolute;
      top: 50%;
      left: 42%;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--paper);
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .note {
      margin-top: 8px;
      padding: 0 6px;
      font-size: 12px;
      color: rgba(244, 241, 236, 0.4);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="phone" data-screen="savings">
    <div class="screen">
      <div class="layout">
        <div class="status-bar">
          <span>9:41</span>
          <span class="icons">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="7" rx="0.5"/><rect x="9" y="2" width="3" height="10" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 3.2c1.8 0 3.4.7 4.6 1.9l1.1-1.1A8.1 8.1 0 0 0 8 1.2 8.1 8.1 0 0 0 2.3 4l1.1 1.1A6.5 6.5 0 0 1 8 3.2zm0 3.2c1 0 1.9.4 2.6 1l1.1-1.1A5 5 0 0 0 8 4.8a5 5 0 0 0-3.7 1.5l1.1 1.1A3.6 3.6 0 0 1 8 6.4zm0 3.1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
            <svg width="27" height="12" viewBox="0 0 27 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.2"/><rect x="23.2" y="4" width="2" height="4" rx="0.6"/></svg>
          </span>
        </div>

        <div class="hero-card">
          <div class="orb a"></div>
          <div class="orb b"></div>
          <div class="hero-inner">
            <div class="hero-label">距離目標</div>
            <div class="hero-years mono">12.5<span>年</span></div>
            <div class="hero-detail">依目前計畫推估</div>
          </div>
          <div class="progress"><i></i></div>
        </div>

        <div class="sheet">
          <div class="group">
            <div class="group-head">
              <span class="t">目標</span>
              <span><span class="v mono">NT$ 36,000,000</span><span class="chev">▾</span></span>
            </div>
            <div class="card">
              <div class="field">
                <span class="label">年花費</span>
                <span class="value mono">1,440,000</span>
              </div>
              <div class="slider">
                <div class="track"><div class="fill"></div><div class="thumb"></div></div>
              </div>
              <div class="field">
                <span class="label">提領率</span>
                <span class="value mono">4.0%</span>
              </div>
            </div>
          </div>

          <div class="group">
            <div class="group-head">
              <span class="t">計畫</span>
              <span><span class="v">約 12.5 年</span><span class="chev">▾</span></span>
            </div>
            <div class="card">
              <div class="field">
                <span class="label">年報酬率</span>
                <span class="value mono">7.00%</span>
              </div>
              <div class="field">
                <span class="label">月投資額</span>
                <span class="value mono">13,500</span>
              </div>
              <div class="slider">
                <div class="track"><div class="fill" style="width:36%"></div><div class="thumb" style="left:36%"></div></div>
              </div>
            </div>
          </div>

          <div class="group">
            <div class="group-head">
              <span class="t">現狀</span>
              <span><span class="v mono">流動 2,000,000</span><span class="chev">▸</span></span>
            </div>
          </div>

          <p class="note">首要回答「還要多久」，不是今天漲了多少。</p>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
</body>
</html>
