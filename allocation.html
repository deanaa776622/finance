<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>資產配置試算</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 導入 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --sub-text: #94a3b8;
      --border-color: #334155;
      --warning-color: #f43f5e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    h2 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-bottom: 5px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-color);
      font-size: 1rem;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: var(--accent-color);
    }
    .unit-suffix {
      position: absolute;
      right: 12px;
      color: var(--sub-text);
      font-size: 0.9rem;
      pointer-events: none;
    }
    .input-wrapper input.has-suffix {
      padding-right: 30px;
    }
    .chart-container {
      position: relative;
      width: 100%;
      height: 250px;
    }
    .total-hint {
      font-size: 0.85rem;
      color: var(--sub-text);
      text-align: right;
    }
    .total-hint.error {
      color: var(--warning-color);
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>資產配置</h2>

  <!-- 配置圓餅圖卡片 -->
  <div class="card">
    <div class="card-title">當前與目標配置比較</div>
    <div class="chart-container">
      <canvas id="allocationChart"></canvas>
    </div>
  </div>

  <!-- 新增區塊：目標比例設定 -->
  <div class="card">
    <div class="card-title">
      <span>目標比例設定</span>
      <span id="target-total-hint" class="total-hint">總計: 100%</span>
    </div>
    <div class="input-group">
      <label>原型 ETF / 股票 (%)</label>
      <div class="input-wrapper">
        <input type="number" id="target_original" value="60" step="1" min="0" max="100" class="has-suffix" oninput="updateTargetAllocation()">
        <span class="unit-suffix">%</span>
      </div>
    </div>
    <div class="input-group">
      <label>槓桿型商品 (%)</label>
      <div class="input-wrapper">
        <input type="number" id="target_leverage" value="20" step="1" min="0" max="100" class="has-suffix" oninput="updateTargetAllocation()">
        <span class="unit-suffix">%</span>
      </div>
    </div>
    <div class="input-group">
      <label>現金 / 保留金 (%)</label>
      <div class="input-wrapper">
        <input type="number" id="target_cash" value="20" step="1" min="0" max="100" class="has-suffix" oninput="updateTargetAllocation()">
        <span class="unit-suffix">%</span>
      </div>
    </div>
  </div>

  <!-- 資產輸入卡片 -->
  <div class="card">
    <div class="card-title">當前資產市值 (元)</div>
    <div class="input-group">
      <label>原型 ETF / 股票</label>
      <input type="text" id="asset_original" value="1,200,000" oninput="formatAndCalculate(this)">
    </div>
    <div class="input-group">
      <label>槓桿型商品</label>
      <input type="text" id="asset_leverage" value="400,000" oninput="formatAndCalculate(this)">
    </div>
    <div class="input-group">
      <label>現金 / 保留金</label>
      <input type="text" id="asset_cash" value="400,000" oninput="formatAndCalculate(this)">
    </div>
  </div>
</div>

<!-- 引入統一管理的導覽列腳本 -->
<script src="nav.js"></script>

<script>
  let allocationChart = null;

  function parseNumber(formattedStr) {
    if (!formattedStr) return 0;
    return parseFloat(formattedStr.toString().replace(/,/g, '')) || 0;
  }

  function formatAndCalculate(input) {
    let rawValue = parseNumber(input.value);
    if (rawValue > 999999999999999) rawValue = 999999999999999; 
    input.value = rawValue ? rawValue.toLocaleString('en-US') : (input.value === '0' ? '0' : '');
    updateAllocation();
  }

  function updateTargetAllocation() {
    const orig = parseFloat(document.getElementById('target_original').value) || 0;
    const lev = parseFloat(document.getElementById('target_leverage').value) || 0;
    const cash = parseFloat(document.getElementById('target_cash').value) || 0;

    const total = orig + lev + cash;
    const hintEl = document.getElementById('target-total-hint');

    hintEl.innerText = `總計: ${total}%`;
    if (Math.abs(total - 100) > 0.01) {
      hintEl.classList.add('error');
    } else {
      hintEl.classList.remove('error');
    }

    localStorage.setItem('target_original', orig);
    localStorage.setItem('target_leverage', lev);
    localStorage.setItem('target_cash', cash);

    updateAllocation();
  }

  function updateAllocation() {
    const orig = parseNumber(document.getElementById('asset_original').value);
    const lev = parseNumber(document.getElementById('asset_leverage').value);
    const cash = parseNumber(document.getElementById('asset_cash').value);

    const total = orig + lev + cash;
    
    localStorage.setItem('alloc_original', orig);
    localStorage.setItem('alloc_leverage', lev);
    localStorage.setItem('alloc_cash', cash);

    const targetOrig = parseFloat(document.getElementById('target_original').value) || 0;
    const targetLev = parseFloat(document.getElementById('target_leverage').value) || 0;
    const targetCash = parseFloat(document.getElementById('target_cash').value) || 0;

    updateChart(orig, lev, cash, total, targetOrig, targetLev, targetCash);
  }

  function updateChart(orig, lev, cash, total, tOrig, tLev, tCash) {
    const ctx = document.getElementById('allocationChart').getContext('2d');
    
    if (allocationChart) {
      allocationChart.destroy();
    }

    const currentPercent = [
      total > 0 ? ((orig / total) * 100).toFixed(1) : 0,
      total > 0 ? ((lev / total) * 100).toFixed(1) : 0,
      total > 0 ? ((cash / total) * 100).toFixed(1) : 0
    ];

    allocationChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['原型', '槓桿', '現金'],
        datasets: [
          {
            label: '當前比例 (%)',
            data: currentPercent,
            backgroundColor: '#38bdf8',
            borderRadius: 6
          },
          {
            label: '目標比例 (%)',
            data: [tOrig, tLev, tCash],
            backgroundColor: '#334155',
            borderColor: '#94a3b8',
            borderWidth: 1,
            borderRadius: 6
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            labels: { color: '#94a3b8', font: { size: 12 } }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return ` ${context.dataset.label}: ${context.raw}%`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: { color: 'transparent' },
            ticks: { color: '#f8fafc', font: { size: 12 } }
          },
          y: {
            grid: { color: '#334155' },
            ticks: { color: '#94a3b8', callback: v => v + '%' },
            max: 100
          }
        }
      }
    });
  }

  window.onload = function() {
    // 讀取目標比例設定
    if (localStorage.getItem('target_original')) document.getElementById('target_original').value = localStorage.getItem('target_original');
    if (localStorage.getItem('target_leverage')) document.getElementById('target_leverage').value = localStorage.getItem('target_leverage');
    if (localStorage.getItem('target_cash')) document.getElementById('target_cash').value = localStorage.getItem('target_cash');

    // 讀取資產市值
    if (localStorage.getItem('alloc_original')) document.getElementById('asset_original').value = parseNumber(localStorage.getItem('alloc_original')).toLocaleString('en-US');
    if (localStorage.getItem('alloc_leverage')) document.getElementById('asset_leverage').value = parseNumber(localStorage.getItem('alloc_leverage')).toLocaleString('en-US');
    if (localStorage.getItem('alloc_cash')) document.getElementById('asset_cash').value = parseNumber(localStorage.getItem('alloc_cash')).toLocaleString('en-US');
    
    updateTargetAllocation();
  };
</script>

</body>
</html>
