<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>退休儲蓄目標試算</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 導入 Chart.js CDN 繪製圖表 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.45);
      --accent-color: #ffffff; /* 高質感亮白 */
      --text-color: #f8fafc;
      --sub-text: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      padding: 20px;
      padding-bottom: 90px !important;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    /* 調音盤玻璃卡片 */
    .tuner-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px 24px 20px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s ease;
    }

    /* 頂部展開提示箭頭 */
    .expand-toggle-icon {
      position: absolute;
      top: 20px;
      right: 24px;
      font-size: 0.75rem;
      color: var(--sub-text);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), color 0.3s ease;
    }

    .tuner-card.expanded .expand-toggle-icon {
      transform: rotate(180deg);
      color: var(--accent-color);
    }

    /* 中央主角：巨大時間顯示 */
    .hero-time {
      text-align: center;
      margin-bottom: 0;
      transition: margin-bottom 0.35s ease;
    }

    .tuner-card.expanded .hero-time {
      margin-bottom: 24px;
    }

    .hero-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--sub-text);
      text-transform: uppercase;
    }

    .hero-value {
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--accent-color);
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.45);
      margin: 4px 0;
      line-height: 1.1;
    }

    .hero-unit {
      font-size: 1.2rem;
      font-weight: 500;
      margin-left: 4px;
    }

    .hero-detail {
      font-size: 0.85rem;
      color: var(--sub-text);
      display: none;
    }

    .tuner-card.expanded .hero-detail {
      display: block;
    }

    /* 可動態摺疊的擴充內容容器 */
    .expandable-content {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
    }

    .tuner-card.expanded .expandable-content {
      max-height: 600px;
      opacity: 1;
      padding-top: 10px;
    }

    /* 整合式控制項區域 */
    .control-row {
      margin-bottom: 18px;
      position: relative;
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      position: relative;
      cursor: ew-resize;
      touch-action: none;
      user-select: none;
    }

    .row-title {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--sub-text);
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    /* 去邊框無痕輸入框 */
    .seamless-input {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.15rem;
      font-weight: 600;
      text-align: right;
      width: 140px;
      outline: none;
      font-family: inherit;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .seamless-input:focus {
      color: var(--accent-color);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .row-header.active .seamless-input {
      color: var(--accent-color);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
    }

    /* 極簡圖表容器 (點擊切換顯現 X/Y 刻度軸) */
    .chart-box {
      height: 120px;
      width: 100%;
      margin-top: 15px;
      position: relative;
      cursor: pointer;
    }

    /* 次要自動鎖定指標 */
    .secondary-info {
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      margin-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.72rem;
      color: var(--sub-text);
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    /* 貼齊卡片底部之微型進度條 */
    .card-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 1;
    }

    .card-progress-fill {
      height: 100%;
      border-radius: 0 2px 2px 0;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.3), #ffffff);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="tuner-card" id="main-tuner-card" onclick="toggleCardExpand(event)">
      
      <!-- 右上角摺疊提示箭頭 -->
      <span class="expand-toggle-icon">▼</span>

      <!-- 核心主角：距離目標年數 -->
      <div class="hero-time">
        <div class="hero-label">距離目標</div>
        <div class="hero-value" id="result-years">-- <span class="hero-unit">YEARS</span></div>
        <div class="hero-detail" id="result-months">-- 個月</div>
      </div>

      <!-- 點擊後可展開顯示的細節資訊 -->
      <div class="expandable-content" id="expandable-content">

        <!-- 調音盤 1: 生活費 -->
        <div class="control-row">
          <div class="row-header" id="row_cost" data-type="cost">
            <span class="row-title">年花費</span>
            <input type="text" id="annual_cost" class="seamless-input" value="1,440,000" oninput="syncCostFromInput(this)" onclick="event.stopPropagation()">
          </div>
        </div>

        <!-- 調音盤 2: 年化報酬率 -->
        <div class="control-row">
          <div class="row-header" id="row_rate" data-type="rate">
            <span class="row-title">年報酬率</span>
            <input type="number" step="0.01" id="rate" class="seamless-input" value="7.00" oninput="syncRateFromInput(this)" onblur="formatRate(this)" onclick="event.stopPropagation()">
          </div>
        </div>

        <!-- 調音盤 3: 每月存入 -->
        <div class="control-row">
          <div class="row-header" id="row_pmt" data-type="pmt">
            <span class="row-title">月投資額</span>
            <input type="text" id="pmt" class="seamless-input" value="13,500" oninput="syncPmtFromInput(this)" onclick="event.stopPropagation()">
          </div>
        </div>

        <!-- 極簡圖表容器 (點擊切換顯示 X/Y 刻度軸) -->
        <div class="chart-box" id="chart-container" onclick="toggleChartAxes(event)">
          <canvas id="assetChart"></canvas>
        </div>

        <!-- 次要自動鎖定指標 -->
        <div class="secondary-info">
          <div class="info-item">
            <span class="info-label">目前資產</span>
            <span class="info-value" id="pv_display">$0</span>
          </div>
          <div class="info-item" style="text-align: right;">
            <span class="info-label">目標金額</span>
            <span class="info-value" id="fv_display">$0</span>
          </div>
        </div>

      </div>

      <!-- 貼齊卡片底部之微型進度條 -->
      <div class="card-progress-track">
        <div class="card-progress-fill" id="asset-progress-fill"></div>
      </div>

    </div>
  </div>

  <script>
    let assetChart = null;
    let isAxesVisible = false;

    // 控制卡片展開與收合
    function toggleCardExpand(e) {
      if (e.target.tagName === 'INPUT' || e.target.classList.contains('seamless-input')) return;
      const card = document.getElementById('main-tuner-card');
      card.classList.toggle('expanded');

      if (card.classList.contains('expanded') && assetChart) {
        setTimeout(() => assetChart.resize(), 50);
      }
    }

    // 點擊圖表切換顯示/隱藏 X 與 Y 軸刻度
    function toggleChartAxes(e) {
      e.stopPropagation(); // 阻止觸發卡片收合
      if (!assetChart) return;
      
      isAxesVisible = !isAxesVisible;
      assetChart.options.scales.x.display = isAxesVisible;
      assetChart.options.scales.y.display = isAxesVisible;
      assetChart.update('none'); // 無縫淡入淡出，不重新跑動態畫
    }

    function formatNumber(num) {
      if (num === null || num === undefined || isNaN(num)) return '0';
      return Number(Math.round(num)).toLocaleString('en-US');
    }

    function parseNumber(formattedStr) {
      if (!formattedStr) return 0;
      return parseFloat(formattedStr.toString().replace(/,/g, '')) || 0;
    }

    function syncCostFromInput(input) {
      let rawValue = parseNumber(input.value);
      input.value = rawValue ? rawValue.toLocaleString('en-US') : (input.value === '0' ? '0' : '');
      calculate();
    }

    function syncRateFromInput(input) {
      let val = parseFloat(input.value);
      if (isNaN(val)) val = 0;
      if (val > 100) {
        val = 100;
        input.value = "100";
      }
      calculate();
    }

    function syncPmtFromInput(input) {
      let rawValue = parseNumber(input.value);
      input.value = rawValue ? rawValue.toLocaleString('en-US') : (input.value === '0' ? '0' : '');
      calculate();
    }

    function formatRate(input) {
      let value = parseFloat(input.value);
      if (!isNaN(value)) {
        input.value = value.toFixed(2);
      }
    }

    function loadAndSyncPV() {
      const aOrig = parseNumber(localStorage.getItem('alloc_original')) || 0;
      const aLev  = parseNumber(localStorage.getItem('alloc_leverage')) || 0;
      const aCash = parseNumber(localStorage.getItem('alloc_cash')) || 0;
      const totalPV = aOrig + aLev + aCash;

      document.getElementById('pv_display').innerText = '$' + formatNumber(totalPV);
      return totalPV;
    }

    function calculateNPER(rate, pmt, pv, fv) {
      if (rate === 0) return -(pv + fv) / pmt;
      const num = pmt - fv * rate;
      const den = pmt + pv * rate;
      if (den === 0 || num / den <= 0) return NaN;
      return Math.log(num / den) / Math.log(1 + rate);
    }

    function calculate() {
      const annualCost = parseNumber(document.getElementById('annual_cost').value);
      let annualRate = (parseFloat(document.getElementById('rate').value) || 0) / 100;
      annualRate = Math.round(annualRate * 10000) / 10000;

      let fv = 0;
      if (annualRate > 0) {
        fv = annualCost / annualRate;
      } else if (annualCost > 0 && annualRate <= 0) {
        fv = Infinity; 
      }
      
      const fvDisplay = document.getElementById('fv_display');
      if (fv === Infinity) {
        fvDisplay.innerText = "需正報酬率";
      } else {
        fvDisplay.innerText = '$' + formatNumber(fv);
        localStorage.setItem('sav_target_total', fv);
      }

      if (typeof updateGlowBackground === 'function') {
        updateGlowBackground(fv === Infinity ? 0 : fv);
      }

      const pvVal = loadAndSyncPV();
      const pmtVal = parseNumber(document.getElementById('pmt').value);
      const monthlyRate = annualRate / 12;

      // 更新卡片底部進度條
      const progressFill = document.getElementById('asset-progress-fill');
      if (progressFill) {
        let progressPercent = 0;
        if (fv > 0 && fv !== Infinity) {
          progressPercent = Math.min(100, (pvVal / fv) * 100);
        }
        progressFill.style.width = `${progressPercent.toFixed(1)}%`;
      }

      const pv = -Math.abs(pvVal);
      const pmt = -Math.abs(pmtVal);

      const totalMonths = calculateNPER(monthlyRate, pmt, pv, (fv === Infinity ? 0 : fv));

      const resultYears = document.getElementById('result-years');
      const resultMonths = document.getElementById('result-months');

      let targetYearsNumber = 0;

      if (fv === Infinity || fvDisplay.innerText === "需正報酬率") {
        resultYears.innerHTML = `-- <span class="hero-unit">YEARS</span>`;
        resultMonths.innerText = "請設定正的報酬率";
        updateChart([], []);
        return;
      } else if (isNaN(totalMonths) || totalMonths <= 0) {
        if (Math.abs(pv) >= fv && fv > 0) {
          resultYears.innerHTML = `0 <span class="hero-unit">YEARS</span>`;
          resultMonths.innerText = "已達成目標！";
          targetYearsNumber = 0;
        } else {
          resultYears.innerHTML = `N/A <span class="hero-unit">YEARS</span>`;
          resultMonths.innerText = "請增加每月存入或報酬率";
          updateChart([], []);
          return;
        }
      } else {
        const years = (totalMonths / 12).toFixed(1);
        const months = Math.ceil(totalMonths);
        resultYears.innerHTML = `${years} <span class="hero-unit">YEARS</span>`;
        resultMonths.innerText = `約 ${months} 個月`;
        targetYearsNumber = parseFloat(years);

        localStorage.setItem('sav_annual_cost', annualCost);
        localStorage.setItem('sav_rate', (annualRate * 100).toFixed(2));
        localStorage.setItem('sav_pmt', Math.abs(pmtVal));
      }

      generateChartData(pvVal, pmtVal, annualRate, targetYearsNumber);
    }

    function generateChartData(initialPv, monthlyPmt, annualRate, yearsTarget) {
      const labels = [];
      const assetData = [];
      const maxYears = Math.max(Math.ceil(yearsTarget) + 1, 5);
      const monthlyRate = annualRate / 12;

      let currentAsset = initialPv;

      for (let yr = 0; yr <= maxYears; yr++) {
        labels.push(`第 ${yr} 年`);
        assetData.push(Math.round(currentAsset));

        for (let m = 0; m < 12; m++) {
          currentAsset = (currentAsset + monthlyPmt) * (1 + monthlyRate);
        }
      }

      updateChart(labels, assetData);
    }

    /* 支援點擊切換刻度軸顯現的 Chart.js 繪製函式 */
    function updateChart(labels, data) {
      const ctx = document.getElementById('assetChart').getContext('2d');

      if (assetChart) {
        assetChart.destroy();
      }

      if (labels.length === 0) return;

      assetChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            borderColor: '#ffffff',
            borderWidth: 2,
            backgroundColor: (context) => {
              const bgCtx = context.chart.ctx;
              const gradient = bgCtx.createLinearGradient(0, 0, 0, 100);
              gradient.addColorStop(0, 'rgba(255, 255, 255, 0.20)');
              gradient.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
              return gradient;
            },
            fill: true,
            tension: 0.4,
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBackgroundColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: true,
              displayColors: false,
              backgroundColor: 'rgba(15, 23, 42, 0.85)',
              titleColor: '#94a3b8',
              bodyColor: '#ffffff',
              borderColor: 'rgba(255, 255, 255, 0.15)',
              borderWidth: 1,
              callbacks: {
                label: (context) => ` 預估資產: $${formatNumber(context.raw)}`
              }
            }
          },
          scales: {
            x: {
              display: isAxesVisible,
              grid: { color: 'rgba(255, 255, 255, 0.06)' },
              ticks: { color: '#64748b', font: { size: 10 } }
            },
            y: {
              display: isAxesVisible,
              grid: { color: 'rgba(255, 255, 255, 0.06)' },
              ticks: {
                color: '#64748b',
                font: { size: 10 },
                callback: (val) => {
                  if (val >= 1e8) return (val / 1e8).toFixed(1) + '億';
                  if (val >= 1e4) return (val / 1e4).toFixed(0) + '萬';
                  return val;
                }
              }
            }
          }
        }
      });
    }

    // 資訊欄微幅拖曳引擎
    function setupRowRelativeDrag(rowId, inputId, type) {
      const row = document.getElementById(rowId);
      const input = document.getElementById(inputId);

      if (!row || !input) return;

      let isDragging = false;
      let startX = 0;
      let initialValue = 0;
      let hasMoved = false;

      function onPointerDown(e) {
        if (e.target === input && document.activeElement === input) return;

        isDragging = true;
        hasMoved = false;
        startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;

        if (type === 'cost' || type === 'pmt') {
          initialValue = parseNumber(input.value);
        } else if (type === 'rate') {
          initialValue = parseFloat(input.value) || 0;
        }

        row.classList.add('active');
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('touchmove', onPointerMove, { passive: false });
        document.addEventListener('mouseup', onPointerUp);
        document.addEventListener('touchend', onPointerUp);
      }

      function onPointerMove(e) {
        if (!isDragging) return;

        const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const deltaX = currentX - startX;

        if (Math.abs(deltaX) > 5) {
          hasMoved = true;
          if (e.cancelable) e.preventDefault();
        }

        if (!hasMoved) return;

        if (type === 'cost') {
          const step = 10000;
          const change = Math.round((deltaX * step) / 12) * 10;
          let newValue = Math.max(0, initialValue + change);
          input.value = formatNumber(newValue);
        } else if (type === 'pmt') {
          const step = 1000;
          const change = Math.round((deltaX * step) / 12) * 10;
          let newValue = Math.max(0, initialValue + change);
          input.value = formatNumber(newValue);
        } else if (type === 'rate') {
          const change = (deltaX * 0.02);
          let newValue = Math.max(0, Math.min(100, initialValue + change));
          input.value = newValue.toFixed(2);
        }

        calculate();
      }

      function onPointerUp() {
        if (!isDragging) return;
        isDragging = false;
        row.classList.remove('active');

        document.removeEventListener('mousemove', onPointerMove);
        document.removeEventListener('touchmove', onPointerMove);
        document.removeEventListener('mouseup', onPointerUp);
        document.removeEventListener('touchend', onPointerUp);
      }

      row.addEventListener('mousedown', onPointerDown);
      row.addEventListener('touchstart', onPointerDown, { passive: true });
    }

    window.onload = function() {
      if (localStorage.getItem('sav_annual_cost')) {
        const savedCost = parseNumber(localStorage.getItem('sav_annual_cost'));
        document.getElementById('annual_cost').value = formatNumber(savedCost);
      }
      if (localStorage.getItem('sav_rate')) {
        const savedRate = parseFloat(localStorage.getItem('sav_rate')) || 0;
        document.getElementById('rate').value = savedRate.toFixed(2);
      }
      if (localStorage.getItem('sav_pmt')) {
        const savedPmt = parseNumber(localStorage.getItem('sav_pmt'));
        document.getElementById('pmt').value = formatNumber(savedPmt);
      }

      setupRowRelativeDrag('row_cost', 'annual_cost', 'cost');
      setupRowRelativeDrag('row_rate', 'rate', 'rate');
      setupRowRelativeDrag('row_pmt', 'pmt', 'pmt');

      calculate();
    };
  </script>

  <!-- 引入統一背景與導覽列腳本 -->
  <script src="glow.js"></script>
  <script src="nav.js"></script>

</body>
</html>
