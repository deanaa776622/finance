<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>退休儲蓄目標試算</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 導入 Chart.js CDN 繪製圖表 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.45);
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --sub-text: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      padding: 20px;
      padding-bottom: 90px !important;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    /* 調音盤玻璃卡片 */
    .tuner-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px 24px 20px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
    }

    /* 中央主角：巨大時間顯示 */
    .hero-time {
      text-align: center;
      margin-bottom: 28px;
    }

    .hero-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--sub-text);
      text-transform: uppercase;
    }

    .hero-value {
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--accent-color);
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
      margin: 4px 0;
      line-height: 1.1;
    }

    .hero-unit {
      font-size: 1.2rem;
      font-weight: 500;
      margin-left: 4px;
    }

    .hero-detail {
      font-size: 0.85rem;
      color: var(--sub-text);
    }

    /* 整合式控制項區域 (不佔額外垂直空間) */
    .control-row {
      margin-bottom: 18px;
      position: relative;
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      position: relative;
      cursor: ew-resize; /* 指示可左右拖曳 */
      touch-action: none;
      user-select: none;
    }

    .row-title {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--sub-text);
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    /* 去邊框無痕輸入框 */
    .seamless-input {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.15rem;
      font-weight: 600;
      text-align: right;
      width: 140px;
      outline: none;
      font-family: inherit;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .seamless-input:focus {
      color: var(--accent-color);
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    /* 拖曳操作時，文字呈現亮藍光暈與微微縮放效果 */
    .row-header.active .seamless-input {
      color: var(--accent-color);
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
    }

    /* 純淨極簡圖表容器 */
    .chart-box {
      height: 110px;
      width: 100%;
      margin-top: 15px;
      position: relative;
    }

    /* 次要自動鎖定指標 */
    .secondary-info {
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      margin-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.72rem;
      color: var(--sub-text);
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="tuner-card">
      
      <!-- 核心主角：退休時間 -->
      <div class="hero-time">
        <div class="hero-label">距離目標</div>
        <div class="hero-value" id="result-years">-- <span class="hero-unit">YEARS</span></div>
        <div class="hero-detail" id="result-months">-- 個月</div>
      </div>

      <!-- 調音盤 1: 生活費 (拖曳整列或數字即可調整) -->
      <div class="control-row">
        <div class="row-header" id="row_cost" data-type="cost">
          <span class="row-title">年花費</span>
          <input type="text" id="annual_cost" class="seamless-input" value="1,440,000" oninput="syncCostFromInput(this)">
        </div>
      </div>

      <!-- 調音盤 2: 年化報酬率 -->
      <div class="control-row">
        <div class="row-header" id="row_rate" data-type="rate">
          <span class="row-title">年報酬率</span>
          <input type="number" step="0.01" id="rate" class="seamless-input" value="7.00" oninput="syncRateFromInput(this)" onblur="formatRate(this)">
        </div>
      </div>

      <!-- 調音盤 3: 每月存入 -->
      <div class="control-row">
        <div class="row-header" id="row_pmt" data-type="pmt">
          <span class="row-title">月投資額</span>
          <input type="text" id="pmt" class="seamless-input" value="13,500" oninput="syncPmtFromInput(this)">
        </div>
      </div>

      <!-- 極簡無邊框流動圖表 -->
      <div class="chart-box">
        <canvas id="assetChart"></canvas>
      </div>

      <!-- 次要自動鎖定指標 -->
      <div class="secondary-info">
        <div class="info-item">
          <span class="info-label">目標金額</span>
          <span class="info-value" id="fv_display">$0</span>
        </div>
        <div class="info-item" style="text-align: right;">
          <span class="info-label">目前資產</span>
          <span class="info-value" id="pv_display">$0</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    let assetChart = null;

    function formatNumber(num) {
      if (num === null || num === undefined || isNaN(num)) return '0';
      return Number(Math.round(num)).toLocaleString('en-US');
    }

    function parseNumber(formattedStr) {
      if (!formattedStr) return 0;
      return parseFloat(formattedStr.toString().replace(/,/g, '')) || 0;
    }

    function syncCostFromInput(input) {
      let rawValue = parseNumber(input.value);
      input.value = rawValue ? rawValue.toLocaleString('en-US') : (input.value === '0' ? '0' : '');
      calculate();
    }

    function syncRateFromInput(input) {
      let val = parseFloat(input.value);
      if (isNaN(val)) val = 0;
      if (val > 100) {
        val = 100;
        input.value = "100";
      }
      calculate();
    }

    function syncPmtFromInput(input) {
      let rawValue = parseNumber(input.value);
      input.value = rawValue ? rawValue.toLocaleString('en-US') : (input.value === '0' ? '0' : '');
      calculate();
    }

    function formatRate(input) {
      let value = parseFloat(input.value);
      if (!isNaN(value)) {
        input.value = value.toFixed(2);
      }
    }

    function loadAndSyncPV() {
      const aOrig = parseNumber(localStorage.getItem('alloc_original')) || 0;
      const aLev  = parseNumber(localStorage.getItem('alloc_leverage')) || 0;
      const aCash = parseNumber(localStorage.getItem('alloc_cash')) || 0;
      const totalPV = aOrig + aLev + aCash;

      document.getElementById('pv_display').innerText = '$' + formatNumber(totalPV);
      return totalPV;
    }

    function calculateNPER(rate, pmt, pv, fv) {
      if (rate === 0) return -(pv + fv) / pmt;
      const num = pmt - fv * rate;
      const den = pmt + pv * rate;
      if (den === 0 || num / den <= 0) return NaN;
      return Math.log(num / den) / Math.log(1 + rate);
    }

    function calculate() {
      const annualCost = parseNumber(document.getElementById('annual_cost').value);
      let annualRate = (parseFloat(document.getElementById('rate').value) || 0) / 100;
      annualRate = Math.round(annualRate * 10000) / 10000;

      let fv = 0;
      if (annualRate > 0) {
        fv = annualCost / annualRate;
      } else if (annualCost > 0 && annualRate <= 0) {
        fv = Infinity; 
      }
      
      const fvDisplay = document.getElementById('fv_display');
      if (fv === Infinity) {
        fvDisplay.innerText = "需正報酬率";
      } else {
        fvDisplay.innerText = '$' + formatNumber(fv);
        localStorage.setItem('sav_target_total', fv);
      }

      if (typeof updateGlowBackground === 'function') {
        updateGlowBackground(fv === Infinity ? 0 : fv);
      }

      const pvVal = loadAndSyncPV();
      const pmtVal = parseNumber(document.getElementById('pmt').value);
      const monthlyRate = annualRate / 12;

      const pv = -Math.abs(pvVal);
      const pmt = -Math.abs(pmtVal);

      const totalMonths = calculateNPER(monthlyRate, pmt, pv, (fv === Infinity ? 0 : fv));

      const resultYears = document.getElementById('result-years');
      const resultMonths = document.getElementById('result-months');

      let targetYearsNumber = 0;

      if (fv === Infinity || fvDisplay.innerText === "需正報酬率") {
        resultYears.innerHTML = `-- <span class="hero-unit">YEARS</span>`;
        resultMonths.innerText = "請設定正的報酬率";
        updateChart([], []);
        return;
      } else if (isNaN(totalMonths) || totalMonths <= 0) {
        if (Math.abs(pv) >= fv && fv > 0) {
          resultYears.innerHTML = `0 <span class="hero-unit">YEARS</span>`;
          resultMonths.innerText = "已達成目標！";
          targetYearsNumber = 0;
        } else {
          resultYears.innerHTML = `N/A <span class="hero-unit">YEARS</span>`;
          resultMonths.innerText = "請增加每月存入或報酬率";
          updateChart([], []);
          return;
        }
      } else {
        const years = (totalMonths / 12).toFixed(1);
        const months = Math.ceil(totalMonths);
        resultYears.innerHTML = `${years} <span class="hero-unit">YEARS</span>`;
        resultMonths.innerText = `約 ${months} 個月`;
        targetYearsNumber = parseFloat(years);

        localStorage.setItem('sav_annual_cost', annualCost);
        localStorage.setItem('sav_rate', (annualRate * 100).toFixed(2));
        localStorage.setItem('sav_pmt', Math.abs(pmtVal));
      }

      generateChartData(pvVal, pmtVal, annualRate, targetYearsNumber);
    }

    function generateChartData(initialPv, monthlyPmt, annualRate, yearsTarget) {
      const labels = [];
      const assetData = [];
      const maxYears = Math.max(Math.ceil(yearsTarget) + 1, 5);
      const monthlyRate = annualRate / 12;

      let currentAsset = initialPv;

      for (let yr = 0; yr <= maxYears; yr++) {
        labels.push(yr);
        assetData.push(Math.round(currentAsset));

        for (let m = 0; m < 12; m++) {
          currentAsset = (currentAsset + monthlyPmt) * (1 + monthlyRate);
        }
      }

      updateChart(labels, assetData);
    }

    /* 無網格極簡曲線圖 */
    function updateChart(labels, data) {
      const ctx = document.getElementById('assetChart').getContext('2d');

      if (assetChart) {
        assetChart.destroy();
      }

      if (labels.length === 0) return;

      assetChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            borderColor: '#38bdf8',
            borderWidth: 2,
            backgroundColor: (context) => {
              const bgCtx = context.chart.ctx;
              const gradient = bgCtx.createLinearGradient(0, 0, 0, 100);
              gradient.addColorStop(0, 'rgba(56, 189, 248, 0.25)');
              gradient.addColorStop(1, 'rgba(56, 189, 248, 0.0)');
              return gradient;
            },
            fill: true,
            tension: 0.4,
            pointRadius: 0,
            pointHoverRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: true,
              callbacks: {
                label: (context) => `$${formatNumber(context.raw)}`
              }
            }
          },
          scales: {
            x: { display: false },
            y: { display: false }
          }
        }
      });
    }

    // 資訊欄直接相容微幅拖曳與輸入手勢引擎
    function setupRowRelativeDrag(rowId, inputId, type) {
      const row = document.getElementById(rowId);
      const input = document.getElementById(inputId);

      if (!row || !input) return;

      let isDragging = false;
      let startX = 0;
      let initialValue = 0;
      let hasMoved = false;

      function onPointerDown(e) {
        // 若使用者正在點擊 input 準備打字，不觸發拖曳
        if (e.target === input && document.activeElement === input) return;

        isDragging = true;
        hasMoved = false;
        startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;

        if (type === 'cost' || type === 'pmt') {
          initialValue = parseNumber(input.value);
        } else if (type === 'rate') {
          initialValue = parseFloat(input.value) || 0;
        }

        row.classList.add('active');
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('touchmove', onPointerMove, { passive: false });
        document.addEventListener('mouseup', onPointerUp);
        document.addEventListener('touchend', onPointerUp);
      }

      function onPointerMove(e) {
        if (!isDragging) return;

        const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const deltaX = currentX - startX;

        // 當移動距離超過 5px，判定為手勢拖曳，取消預設點擊事件
        if (Math.abs(deltaX) > 5) {
          hasMoved = true;
          if (e.cancelable) e.preventDefault();
        }

        if (!hasMoved) return;

        if (type === 'cost') {
          const step = 10000;
          const change = Math.round((deltaX * step) / 12) * 10;
          let newValue = Math.max(0, initialValue + change);
          input.value = formatNumber(newValue);
        } else if (type === 'pmt') {
          const step = 1000;
          const change = Math.round((deltaX * step) / 12) * 10;
          let newValue = Math.max(0, initialValue + change);
          input.value = formatNumber(newValue);
        } else if (type === 'rate') {
          const change = (deltaX * 0.02);
          let newValue = Math.max(0, Math.min(100, initialValue + change));
          input.value = newValue.toFixed(2);
        }

        calculate();
      }

      function onPointerUp() {
        if (!isDragging) return;
        isDragging = false;
        row.classList.remove('active');

        document.removeEventListener('mousemove', onPointerMove);
        document.removeEventListener('touchmove', onPointerMove);
        document.removeEventListener('mouseup', onPointerUp);
        document.removeEventListener('touchend', onPointerUp);
      }

      row.addEventListener('mousedown', onPointerDown);
      row.addEventListener('touchstart', onPointerDown, { passive: true });
    }

    window.onload = function() {
      if (localStorage.getItem('sav_annual_cost')) {
        const savedCost = parseNumber(localStorage.getItem('sav_annual_cost'));
        document.getElementById('annual_cost').value = formatNumber(savedCost);
      }
      if (localStorage.getItem('sav_rate')) {
        const savedRate = parseFloat(localStorage.getItem('sav_rate')) || 0;
        document.getElementById('rate').value = savedRate.toFixed(2);
      }
      if (localStorage.getItem('sav_pmt')) {
        const savedPmt = parseNumber(localStorage.getItem('sav_pmt'));
        document.getElementById('pmt').value = formatNumber(savedPmt);
      }

      // 將三個欄位綁定無痕相對拖曳手勢
      setupRowRelativeDrag('row_cost', 'annual_cost', 'cost');
      setupRowRelativeDrag('row_rate', 'rate', 'rate');
      setupRowRelativeDrag('row_pmt', 'pmt', 'pmt');

      calculate();
    };
  </script>

  <!-- 引入統一背景與導覽列腳本 -->
  <script src="glow.js"></script>
  <script src="nav.js"></script>

</body>
</html>
