<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>退休儲蓄目標試算</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 導入 Chart.js CDN 繪製圖表 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --sub-text: #94a3b8;
      --border-color: #334155;
      --disabled-bg: #0b1120;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    h2 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-color);
      font-size: 1rem;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: var(--accent-color);
    }
    input:disabled {
      background-color: var(--disabled-bg);
      color: var(--sub-text);
      cursor: not-allowed;
      border-style: dashed;
    }
    .result-box {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }
    .result-title {
      font-size: 0.9rem;
      color: var(--sub-text);
    }
    .result-value {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 5px 0;
    }
    .result-detail {
      font-size: 0.85rem;
      color: var(--sub-text);
    }
    .chart-container {
      position: relative;
      width: 100%;
      height: 260px;
      margin-top: 10px;
    }

/* 確保頁面底部不被導覽列遮擋 */
body {
  padding-bottom: 70px !important;
}

  </style>
</head>
<body>

<div class="container">
  <h2>退休儲蓄目標試算</h2>
  
  <!-- 輸入卡片 -->
  <div class="card">
    <div class="input-group">
      <label>預期退休年生活費 (元)</label>
      <input type="text" id="annual_cost" value="1,440,000" oninput="formatAndCalculate(this)">
    </div>

    <div class="input-group">
      <label>預期年化報酬率 (%) <span style="font-size:0.7rem;">(支援小數後兩位)</span></label>
      <input type="number" step="0.01" id="rate" value="7.00" oninput="calculate()" onblur="formatRate(this)">
    </div>

    <div class="input-group">
      <label>未來目標金額 (元) <span style="font-size:0.7rem;">(公式自動計算)</span></label>
      <input type="text" id="fv" value="20,571,429" disabled>
    </div>

    <div class="input-group">
      <label>目前持有金額 (元)</label>
      <input type="text" id="pv" value="11,622,880" oninput="formatAndCalculate(this)">
    </div>
    
    <div class="input-group">
      <label>每月定期存入金額 (元)</label>
      <input type="text" id="pmt" value="13,500" oninput="formatAndCalculate(this)">
    </div>
    
    <div class="result-box">
      <div class="result-title">預計達成目標時間</div>
      <div class="result-value" id="result-years">-- 年</div>
      <div class="result-detail" id="result-months">-- 個月</div>
    </div>
  </div>

  <!-- 新增：資產成長曲線圖卡片 -->
  <div class="card">
    <div class="result-title" style="text-align: left; margin-bottom: 10px;">預估資產累積曲線</div>
    <div class="chart-container">
      <canvas id="assetChart"></canvas>
    </div>
  </div>
</div>

<script>
  let assetChart = null; // 儲存圖表實例

  function formatNumber(num) {
    if (num === null || num === undefined || isNaN(num)) return '';
    return Number(Math.round(num)).toLocaleString('en-US');
  }

  function parseNumber(formattedStr) {
    if (!formattedStr) return 0;
    return parseFloat(formattedStr.toString().replace(/,/g, '')) || 0;
  }

  function formatAndCalculate(input) {
    let rawValue = parseNumber(input.value);
    if (rawValue > 999999999999999) rawValue = 999999999999999; 
    input.value = rawValue ? rawValue.toLocaleString('en-US') : (input.value === '0' ? '0' : '');
    calculate();
  }

  function formatRate(input) {
    let value = parseFloat(input.value);
    if (!isNaN(value)) {
      input.value = value.toFixed(2);
    }
  }

  function calculateNPER(rate, pmt, pv, fv) {
    if (rate === 0) return -(pv + fv) / pmt;
    const num = pmt - fv * rate;
    const den = pmt + pv * rate;
    if (den === 0 || num / den <= 0) return NaN;
    return Math.log(num / den) / Math.log(1 + rate);
  }

  function calculate() {
    const annualCost = parseNumber(document.getElementById('annual_cost').value);
    let annualRate = (parseFloat(document.getElementById('rate').value) || 0) / 100;
    annualRate = Math.round(annualRate * 10000) / 10000;

    let fv = 0;
    if (annualRate > 0) {
      fv = annualCost / annualRate;
    } else if (annualCost > 0 && annualRate <= 0) {
      fv = Infinity; 
    }
    
    const fvInput = document.getElementById('fv');
    if (fv === Infinity) {
        fvInput.value = "需正報酬率才能反推";
    } else {
        fvInput.value = formatNumber(fv);
    }

    const pvVal = parseNumber(document.getElementById('pv').value);
    const pmtVal = parseNumber(document.getElementById('pmt').value);
    const monthlyRate = annualRate / 12;

    const pv = -Math.abs(pvVal);
    const pmt = -Math.abs(pmtVal);

    const totalMonths = calculateNPER(monthlyRate, pmt, pv, (fv === Infinity ? 0 : fv));

    const resultYears = document.getElementById('result-years');
    const resultMonths = document.getElementById('result-months');

    let targetYearsNumber = 0;

    if (fv === Infinity || fvInput.value === "需正報酬率才能反推") {
        resultYears.innerText = "無法計算";
        resultMonths.innerText = "請設定正的報酬率";
        updateChart([], [], fv);
        return;
    } else if (isNaN(totalMonths) || totalMonths <= 0) {
      if (Math.abs(pv) >= fv && fv > 0) {
        resultYears.innerText = "已達成目標！";
        resultYears.style.fontSize = "1.8rem";
        resultMonths.innerText = "目前資產已足夠支應退休生活";
        targetYearsNumber = 0;
      } else {
        resultYears.innerText = "無法達成";
        resultYears.style.fontSize = "2.2rem";
        resultMonths.innerText = "請增加每月存入金額或預期報酬率";
        updateChart([], [], fv);
        return;
      }
    } else {
      resultYears.style.fontSize = "2.2rem";
      const years = (totalMonths / 12).toFixed(2);
      const months = Math.ceil(totalMonths);
      resultYears.innerText = `${years} 年`;
      resultMonths.innerText = `約 ${months} 個月`;
      targetYearsNumber = parseFloat(years);

      localStorage.setItem('sav_annual_cost', annualCost);
      localStorage.setItem('sav_rate', (annualRate * 100).toFixed(2));
      localStorage.setItem('sav_pv', Math.abs(pv));
      localStorage.setItem('sav_pmt', Math.abs(pmt));
    }

    // 計算每年預估資產，用於繪製曲線圖
    generateChartData(pvVal, pmtVal, annualRate, targetYearsNumber, fv);
  }

  // 逐年模擬資產成長並繪製圖表
  function generateChartData(initialPv, monthlyPmt, annualRate, yearsTarget, fv) {
    const labels = [];
    const assetData = [];
    
    // 最多預測至達成年數的 1.2 倍或至少 5 年
    const maxYears = Math.max(Math.ceil(yearsTarget) + 1, 5);
    const monthlyRate = annualRate / 12;

    let currentAsset = initialPv;

    for (let yr = 0; yr <= maxYears; yr++) {
      labels.push(`第 ${yr} 年`);
      assetData.push(Math.round(currentAsset));

      // 模擬下一年的 12 個月複利及投入
      for (let m = 0; m < 12; m++) {
        currentAsset = (currentAsset + monthlyPmt) * (1 + monthlyRate);
      }
    }

    updateChart(labels, assetData, fv);
  }

  // 更新或創建 Chart.js 折線圖
  function updateChart(labels, data, fvTarget) {
    const ctx = document.getElementById('assetChart').getContext('2d');

    if (assetChart) {
      assetChart.destroy(); // 銷毀舊圖表以供重繪
    }

    if (labels.length === 0) return;

    assetChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '預估總資產 (元)',
          data: data,
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.1)',
          fill: true,
          tension: 0.3, // 曲線平滑度
          pointRadius: 3,
          pointHoverRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                return ` 資產: $${formatNumber(context.raw)}`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: { color: '#334155' },
            ticks: { color: '#94a3b8', font: { size: 10 } }
          },
          y: {
            grid: { color: '#334155' },
            ticks: { 
              color: '#94a3b8',
              font: { size: 10 },
              callback: function(value) {
                if (value >= 100000000) return (value / 100000000).toFixed(1) + '億';
                if (value >= 10000) return (value / 10000).toFixed(0) + '萬';
                return value;
              }
            }
          }
        }
      }
    });
  }

  window.onload = function() {
    if (localStorage.getItem('sav_annual_cost')) {
      document.getElementById('annual_cost').value = formatNumber(localStorage.getItem('sav_annual_cost'));
    }
    if (localStorage.getItem('sav_rate')) {
      document.getElementById('rate').value = localStorage.getItem('sav_rate');
    }
    if (localStorage.getItem('sav_pv')) {
      document.getElementById('pv').value = formatNumber(localStorage.getItem('sav_pv'));
    }
    if (localStorage.getItem('sav_pmt')) {
      document.getElementById('pmt').value = formatNumber(localStorage.getItem('sav_pmt'));
    }
    calculate();
  };
</script>
<!-- 引入統一管理的導覽列腳本 -->
<script src="nav.js"></script>

</body>
</html>
