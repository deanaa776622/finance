<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>退休儲蓄目標試算</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 導入 Chart.js CDN 繪製圖表 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      /* 微光玻璃質感背景：半透明深色 + 邊框 */
      --card-bg: rgba(30, 41, 59, 0.55);
      --input-bg: rgba(15, 23, 42, 0.6);
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --sub-text: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.12);
      --disabled-bg: rgba(11, 17, 32, 0.5);
      --s-orig: 1;
      --s-lev: 1;
      --s-cash: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* === 1. 首頁流動光暈背景層 === */
    .glow-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      width: 160vw;
      height: 160vw;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.75;
      mix-blend-mode: screen;
      transition: background 0.8s ease;
      transform-origin: center center;
    }

    .blob-original {
      top: -20vh;
      left: -20vw;
      animation: smoothRotateOriginal 22s linear infinite;
    }

    .blob-leverage {
      top: -20vh;
      right: -20vw;
      animation: smoothRotateLeverage 28s linear infinite;
    }

    .blob-cash {
      bottom: -30vh;
      left: -10vw;
      animation: smoothRotateCash 25s linear infinite;
    }

    @keyframes smoothRotateOriginal {
      0% { transform: rotate(0deg) translate(-10vw, -10vh) rotate(0deg) scale(var(--s-orig)); }
      50% { transform: rotate(180deg) translate(-10vw, -10vh) rotate(-180deg) scale(calc(var(--s-orig) * 1.15)); }
      100% { transform: rotate(360deg) translate(-10vw, -10vh) rotate(-360deg) scale(var(--s-orig)); }
    }

    @keyframes smoothRotateLeverage {
      0% { transform: rotate(0deg) translate(12vw, -8vh) rotate(0deg) scale(var(--s-lev)); }
      50% { transform: rotate(-180deg) translate(12vw, -8vh) rotate(180deg) scale(calc(var(--s-lev) * 0.9)); }
      100% { transform: rotate(-360deg) translate(12vw, -8vh) rotate(-360deg) scale(var(--s-lev)); }
    }

    @keyframes smoothRotateCash {
      0% { transform: rotate(0deg) translate(0vw, 15vh) rotate(0deg) scale(calc(var(--s-cash) * 0.95)); }
      50% { transform: rotate(180deg) translate(0vw, 15vh) rotate(-180deg) scale(calc(var(--s-cash) * 1.1)); }
      100% { transform: rotate(360deg) translate(0vw, 15vh) rotate(-360deg) scale(calc(var(--s-cash) * 0.95)); }
    }

    /* === 2. 內容視窗與半透明玻璃卡片 === */
    body {
      padding: 20px;
      padding-bottom: 85px !important;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    h2 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* 玻璃擬物卡片核心樣式 */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-bottom: 5px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 1rem;
      box-sizing: border-box;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    input:disabled {
      background-color: var(--disabled-bg);
      color: var(--sub-text);
      cursor: not-allowed;
      border-style: dashed;
    }

    /* 滑桿控制樣式 */
    .slider-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
    }

    .result-box {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .result-title {
      font-size: 0.9rem;
      color: var(--sub-text);
    }

    .result-value {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 5px 0;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .result-detail {
      font-size: 0.85rem;
      color: var(--sub-text);
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 260px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- 光暈背景層 -->
  <div class="glow-container">
    <div id="blob-original" class="blob blob-original"></div>
    <div id="blob-leverage" class="blob blob-leverage"></div>
    <div id="blob-cash" class="blob blob-cash"></div>
  </div>

  <div class="container">
    <h2>退休儲蓄目標試算</h2>
    
    <!-- 輸入卡片 -->
    <div class="card">
      <div class="input-group">
        <label>預期退休年生活費 (元)</label>
        <input type="text" id="annual_cost" value="1,440,000" oninput="syncCostFromInput(this)">
        <div class="slider-wrapper">
          <input type="range" id="annual_cost_slider" min="0" max="10000000" step="10000" value="1440000" oninput="syncCostFromSlider(this)">
        </div>
      </div>

      <div class="input-group">
        <label>預期年化報酬率 (%) <span style="font-size:0.7rem;">(支援小數後兩位)</span></label>
        <input type="number" step="0.01" id="rate" value="7.00" oninput="syncRateFromInput(this)" onblur="formatRate(this)">
        <div class="slider-wrapper">
          <input type="range" id="rate_slider" min="0" max="50" step="0.1" value="7.00" oninput="syncRateFromSlider(this)">
        </div>
      </div>

      <div class="input-group">
        <label>未來目標金額 (元) <span style="font-size:0.7rem;">(公式自動計算)</span></label>
        <input type="text" id="fv" value="20,571,429" disabled>
      </div>

      <div class="input-group">
        <label>目前持有金額 (元) <span style="font-size:0.7rem;">(來自資產配置總和)</span></label>
        <input type="text" id="pv" value="0" disabled>
      </div>
      
      <div class="input-group">
        <label>每月定期存入金額 (元)</label>
        <input type="text" id="pmt" value="13,500" oninput="syncPmtFromInput(this)">
        <div class="slider-wrapper">
          <input type="range" id="pmt_slider" min="0" max="1000000" step="1000" value="13500" oninput="syncPmtFromSlider(this)">
        </div>
      </div>
      
      <div class="result-box">
        <div class="result-title">預計達成目標時間</div>
        <div class="result-value" id="result-years">-- 年</div>
        <div class="result-detail" id="result-months">-- 個月</div>
      </div>
    </div>

    <!-- 資產成長曲線圖卡片 -->
    <div class="card">
      <div class="result-title" style="text-align: left; margin-bottom: 10px;">預估資產累積曲線</div>
      <div class="chart-container">
        <canvas id="assetChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let assetChart = null;

    const COLOR_ORIGINAL = { r: 56,  g: 189, b: 248 };
    const COLOR_LEVERAGE = { r: 74,  g: 222, b: 128 };
    const COLOR_CASH     = { r: 250, g: 204, b: 21  };
    const COLOR_RED      = { r: 244, g: 63,  b: 94  };

    function formatNumber(num) {
      if (num === null || num === undefined || isNaN(num)) return '';
      return Number(Math.round(num)).toLocaleString('en-US');
    }

    function parseNumber(formattedStr) {
      if (!formattedStr) return 0;
      return parseFloat(formattedStr.toString().replace(/,/g, '')) || 0;
    }

    function interpolateColor(baseColor, targetColor, factor) {
      const f = Math.min(Math.max(factor, 0), 1);
      const r = Math.round(baseColor.r + f * (targetColor.r - baseColor.r));
      const g = Math.round(baseColor.g + f * (targetColor.g - baseColor.g));
      const b = Math.round(baseColor.b + f * (targetColor.b - baseColor.b));
      return `rgba(${r}, ${g}, ${b}, 1)`;
    }

    // 讀取資產數據並動態控制光暈大小與顏色
    function updateGlowBackground(futureTotalTarget) {
      const tOrig = parseFloat(localStorage.getItem('target_original')) || 60;
      const tLev  = parseFloat(localStorage.getItem('target_leverage')) || 20;
      const tCash = parseFloat(localStorage.getItem('target_cash')) || 20;

      const aOrig = parseNumber(localStorage.getItem('alloc_original')) || 0;
      const aLev  = parseNumber(localStorage.getItem('alloc_leverage')) || 0;
      const aCash = parseNumber(localStorage.getItem('alloc_cash')) || 0;

      const targetAmtOrig = futureTotalTarget * (tOrig / 100);
      const targetAmtLev  = futureTotalTarget * (tLev / 100);
      const targetAmtCash = futureTotalTarget * (tCash / 100);

      const scaleOrig = targetAmtOrig > 0 ? Math.min(Math.sqrt(aOrig / targetAmtOrig), 1) : (aOrig > 0 ? 1 : 0);
      const scaleLev  = targetAmtLev > 0 ? Math.min(Math.sqrt(aLev / targetAmtLev), 1) : (aLev > 0 ? 1 : 0);
      const scaleCash = targetAmtCash > 0 ? Math.min(Math.sqrt(aCash / targetAmtCash), 1) : (aCash > 0 ? 1 : 0);

      document.documentElement.style.setProperty('--s-orig', scaleOrig);
      document.documentElement.style.setProperty('--s-lev', scaleLev);
      document.documentElement.style.setProperty('--s-cash', scaleCash);

      const total = aOrig + aLev + aCash;
      let cOrig = 0, cLev = 0, cCash = 0;
      if (total > 0) {
        cOrig = (aOrig / total) * 100;
        cLev  = (aLev / total) * 100;
        cCash = (aCash / total) * 100;
      }

      const diffOrig = Math.abs(cOrig - tOrig);
      const diffLev  = Math.abs(cLev - tLev);
      const diffCash = Math.abs(cCash - tCash);

      const colorOrigStr = interpolateColor(COLOR_ORIGINAL, COLOR_RED, diffOrig / 10);
      const colorLevStr  = interpolateColor(COLOR_LEVERAGE, COLOR_RED, diffLev / 10);
      const colorCashStr = interpolateColor(COLOR_CASH, COLOR_RED, diffCash / 10);

      document.getElementById('blob-original').style.background = `radial-gradient(circle, ${colorOrigStr} 0%, rgba(0,0,0,0) 70%)`;
      document.getElementById('blob-leverage').style.background = `radial-gradient(circle, ${colorLevStr} 0%, rgba(0,0,0,0) 70%)`;
      document.getElementById('blob-cash').style.background = `radial-gradient(circle, ${colorCashStr} 0%, rgba(0,0,0,0) 70%)`;
    }

    function syncCostFromInput(input) {
      let rawValue = parseNumber(input.value);
      if (rawValue > 10000000) rawValue = 10000000;
      input.value = rawValue ? rawValue.toLocaleString('en-US') : (input.value === '0' ? '0' : '');
      document.getElementById('annual_cost_slider').value = rawValue;
      calculate();
    }

    function syncCostFromSlider(slider) {
      const val = parseFloat(slider.value) || 0;
      document.getElementById('annual_cost').value = formatNumber(val);
      calculate();
    }

    function syncRateFromInput(input) {
      let val = parseFloat(input.value);
      if (isNaN(val)) val = 0;
      if (val > 50) {
        val = 50;
        input.value = "50";
      }
      document.getElementById('rate_slider').value = val;
      calculate();
    }

    function syncRateFromSlider(slider) {
      const val = parseFloat(slider.value) || 0;
      document.getElementById('rate').value = val.toFixed(2);
      calculate();
    }

    function syncPmtFromInput(input) {
      let rawValue = parseNumber(input.value);
      if (rawValue > 1000000) rawValue = 1000000;
      input.value = rawValue ? rawValue.toLocaleString('en-US') : (input.value === '0' ? '0' : '');
      document.getElementById('pmt_slider').value = rawValue;
      calculate();
    }

    function syncPmtFromSlider(slider) {
      const val = parseFloat(slider.value) || 0;
      document.getElementById('pmt').value = formatNumber(val);
      calculate();
    }

    function formatRate(input) {
      let value = parseFloat(input.value);
      if (!isNaN(value)) {
        input.value = value.toFixed(2);
        document.getElementById('rate_slider').value = value;
      }
    }

    function loadAndSyncPV() {
      const aOrig = parseNumber(localStorage.getItem('alloc_original')) || 0;
      const aLev  = parseNumber(localStorage.getItem('alloc_leverage')) || 0;
      const aCash = parseNumber(localStorage.getItem('alloc_cash')) || 0;
      const totalPV = aOrig + aLev + aCash;

      document.getElementById('pv').value = formatNumber(totalPV);
      return totalPV;
    }

    function calculateNPER(rate, pmt, pv, fv) {
      if (rate === 0) return -(pv + fv) / pmt;
      const num = pmt - fv * rate;
      const den = pmt + pv * rate;
      if (den === 0 || num / den <= 0) return NaN;
      return Math.log(num / den) / Math.log(1 + rate);
    }

    function calculate() {
      const annualCost = parseNumber(document.getElementById('annual_cost').value);
      let annualRate = (parseFloat(document.getElementById('rate').value) || 0) / 100;
      annualRate = Math.round(annualRate * 10000) / 10000;

      let fv = 0;
      if (annualRate > 0) {
        fv = annualCost / annualRate;
      } else if (annualCost > 0 && annualRate <= 0) {
        fv = Infinity; 
      }
      
      const fvInput = document.getElementById('fv');
      if (fv === Infinity) {
          fvInput.value = "需正報酬率才能反推";
      } else {
          fvInput.value = formatNumber(fv);
          localStorage.setItem('sav_target_total', fv);
      }

      updateGlowBackground(fv === Infinity ? 0 : fv);

      const pvVal = loadAndSyncPV();
      const pmtVal = parseNumber(document.getElementById('pmt').value);
      const monthlyRate = annualRate / 12;

      const pv = -Math.abs(pvVal);
      const pmt = -Math.abs(pmtVal);

      const totalMonths = calculateNPER(monthlyRate, pmt, pv, (fv === Infinity ? 0 : fv));

      const resultYears = document.getElementById('result-years');
      const resultMonths = document.getElementById('result-months');

      let targetYearsNumber = 0;

      if (fv === Infinity || fvInput.value === "需正報酬率才能反推") {
          resultYears.innerText = "無法計算";
          resultMonths.innerText = "請設定正的報酬率";
          updateChart([], [], fv);
          return;
      } else if (isNaN(totalMonths) || totalMonths <= 0) {
        if (Math.abs(pv) >= fv && fv > 0) {
          resultYears.innerText = "已達成目標！";
          resultYears.style.fontSize = "1.8rem";
          resultMonths.innerText = "目前資產已足夠支應退休生活";
          targetYearsNumber = 0;
        } else {
          resultYears.innerText = "無法達成";
          resultYears.style.fontSize = "2.2rem";
          resultMonths.innerText = "請增加每月存入金額或預期報酬率";
          updateChart([], [], fv);
          return;
        }
      } else {
        resultYears.style.fontSize = "2.2rem";
        const years = (totalMonths / 12).toFixed(2);
        const months = Math.ceil(totalMonths);
        resultYears.innerText = `${years} 年`;
        resultMonths.innerText = `約 ${months} 個月`;
        targetYearsNumber = parseFloat(years);

        localStorage.setItem('sav_annual_cost', annualCost);
        localStorage.setItem('sav_rate', (annualRate * 100).toFixed(2));
        localStorage.setItem('sav_pmt', Math.abs(pmtVal));
      }

      generateChartData(pvVal, pmtVal, annualRate, targetYearsNumber, fv);
    }

    function generateChartData(initialPv, monthlyPmt, annualRate, yearsTarget, fv) {
      const labels = [];
      const assetData = [];
      
      const maxYears = Math.max(Math.ceil(yearsTarget) + 1, 5);
      const monthlyRate = annualRate / 12;

      let currentAsset = initialPv;

      for (let yr = 0; yr <= maxYears; yr++) {
        labels.push(`第 ${yr} 年`);
        assetData.push(Math.round(currentAsset));

        for (let m = 0; m < 12; m++) {
          currentAsset = (currentAsset + monthlyPmt) * (1 + monthlyRate);
        }
      }

      updateChart(labels, assetData, fv);
    }

    function updateChart(labels, data, fvTarget) {
      const ctx = document.getElementById('assetChart').getContext('2d');

      if (assetChart) {
        assetChart.destroy();
      }

      if (labels.length === 0) return;

      assetChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '預估總資產 (元)',
            data: data,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return ` 資產: $${formatNumber(context.raw)}`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.1)' },
              ticks: { color: '#94a3b8', font: { size: 10 } }
            },
            y: {
              grid: { color: 'rgba(255, 255, 255, 0.1)' },
              ticks: { 
                color: '#94a3b8',
                font: { size: 10 },
                callback: function(value) {
                  if (value >= 100000000) return (value / 100000000).toFixed(1) + '億';
                  if (value >= 10000) return (value / 10000).toFixed(0) + '萬';
                  return value;
                }
              }
            }
          }
        }
      });
    }

    window.onload = function() {
      if (localStorage.getItem('sav_annual_cost')) {
        const savedCost = parseNumber(localStorage.getItem('sav_annual_cost'));
        document.getElementById('annual_cost').value = formatNumber(savedCost);
        document.getElementById('annual_cost_slider').value = savedCost;
      }
      if (localStorage.getItem('sav_rate')) {
        const savedRate = parseFloat(localStorage.getItem('sav_rate')) || 0;
        document.getElementById('rate').value = savedRate.toFixed(2);
        document.getElementById('rate_slider').value = savedRate;
      }
      if (localStorage.getItem('sav_pmt')) {
        const savedPmt = parseNumber(localStorage.getItem('sav_pmt'));
        document.getElementById('pmt').value = formatNumber(savedPmt);
        document.getElementById('pmt_slider').value = savedPmt;
      }
      calculate();
    };
  </script>

  <!-- 引入統一管理的導覽列腳本 -->
  <script src="nav.js"></script>

</body>
</html>
